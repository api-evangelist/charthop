openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Category Sort API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: category-sort
paths:
  /v1/org/{orgId}/category-sort:
    get:
      tags:
      - category-sort
      summary: Return category sort order
      operationId: getCategorySort
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySort'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
        '500':
          description: Not Implemented
    post:
      tags:
      - category-sort
      summary: Create a category sort order if it doesn't exist
      operationId: createCategorySort
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Category sort order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySort'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
        '500':
          description: Not Implemented
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategorySort'
        description: Sort data to create
        required: true
    put:
      tags:
      - category-sort
      summary: Create or update category sort order for a given org and return the sort data
      operationId: updateOrCreateCategorySort
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Category sort order created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySort'
        '400':
          description: categoryIds cannot be empty
        '403':
          description: Permission denied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategorySort'
        description: Category Ids in sort order
        required: true
    patch:
      tags:
      - category-sort
      summary: Update an existing category sort order
      operationId: updateCategorySort
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Not Implemented
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategorySort'
        description: Sort data to update
        required: true
    delete:
      tags:
      - category-sort
      summary: Delete a category sort order
      operationId: deleteCategorySort
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Not Implemented
  /v1/org/{orgId}/category-sort/upsert:
    post:
      tags:
      - category-sort
      summary: Create or update category sort order for a given org and return the sort data
      operationId: upsertCategorySort
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Category sort order created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySort'
        '400':
          description: categoryIds cannot be empty
        '403':
          description: Permission denied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategorySort'
        description: Category Ids in sort order
        required: true
components:
  schemas:
    CreateCategorySort:
      type: object
      required:
      - orgId
      - categoryIds
      properties:
        orgId:
          type: string
          description: parent organization id (empty if built-in)
          example: 588f7ee98f138b19220041a7
        categoryIds:
          type: array
          description: ordered list of category ids of an org
          items:
            type: string
            example: 588f7ee98f138b19220041a7
    UpdateCategorySort:
      type: object
      properties:
        categoryIds:
          type: array
          description: ordered list of category ids of an org
          items:
            type: string
            example: 588f7ee98f138b19220041a7
    CategorySort:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent organization id (empty if built-in)
          example: 588f7ee98f138b19220041a7
        categoryIds:
          type: array
          description: ordered list of category ids of an org
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        createId:
          type: string
          description: created by user id
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        deleteId:
          type: string
          description: deleted by user id
          example: 588f7ee98f138b19220041a7
        deleteBehalfId:
          type: string
          description: deleted on behalf of user id
          example: 588f7ee98f138b19220041a7
        deleteAttribution:
          $ref: '#/components/schemas/Attribution'
        deleteAt:
          type: string
          description: deleted timestamp
          example: '2017-01-24T13:57:52Z'
    Attribution:
      type: object
      properties:
        principalUserId:
          type: string
          example: 588f7ee98f138b19220041a7
        agentUserIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        eventId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiChatId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiToolUseId:
          type: string
        channel:
          type: string
          enum:
          - WEB
          - MOBILE
          - SLACK
          - TEAMS
          - MCP
