  PartialJob:
    type: object
    properties:
      jobId:
        type: string
        description: globally unique job id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id
        example: 588f7ee98f138b19220041a7
      snapshotId:
        type: string
        description: snapshot that this job belongs to
        example: 588f7ee98f138b19220041a7
