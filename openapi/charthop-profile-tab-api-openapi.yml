        type: string
        description: view sensitive of the job while open
        enum:
        - GLOBAL
        - ORG
        - SENSITIVE
        - PERSONAL
        - MANAGER
        - HIGH
        - PRIVATE
      relationships:
        type: array
        description: relationship to other jobs
        uniqueItems: true
        items:
          $ref: '#/definitions/JobRelationship'
      groupIds:
        type: array
        description: groups that this job is a member of
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      groupIdsByType:
        type: object
        description: groups that this job is a member of, mapped by group type id
        additionalProperties:
          type: array
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
      placement:
        type: string
        description: guidance on placement
        enum:
        - NORMAL
        - ASSISTANT
