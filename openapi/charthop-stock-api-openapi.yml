openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Stock API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: Stock
paths:
  /v1/stock:
    get:
      tags:
      - Stock
      summary: Return the history of stock prices
      operationId: findStockPrices
      parameters:
      - name: symbol
        in: query
        description: Symbol to query
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: Types of valuations to retrieve
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Date to start from
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: Number of results to return
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsStockPrice'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/stock/{id}:
    delete:
      tags:
      - Stock
      summary: Delete a stock price
      operationId: deleteStockPrice
      parameters:
      - name: id
        in: path
        description: Stock entry id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: stock price deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/stock/{symbol}/{date}/{type}:
    get:
      tags:
      - Stock
      summary: Get a stock price as of a particular date
      operationId: getStockPrice
      parameters:
      - name: symbol
        in: path
        description: Stock symbol
        required: true
        schema:
          type: string
      - name: date
        in: path
        description: Date to update information for
        required: true
        schema:
          type: string
          format: date
      - name: type
        in: path
        description: Type of stock price to retrieve (for example 'public')
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPrice'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
    put:
      tags:
      - Stock
      summary: Upsert a stock price
      operationId: upsertStock
      parameters:
      - name: symbol
        in: path
        description: Stock symbol
        required: true
        schema:
          type: string
      - name: date
        in: path
        description: Date to update information for
        required: true
        schema:
          type: string
          format: date
      - name: type
        in: path
        description: Type of stock price to upsert
        required: true
        schema:
          type: string
      responses:
        '201':
          description: stock price created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPrice'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockPrice'
        description: Stock price data to create
        required: true
components:
  schemas:
    Attribution:
      type: object
      properties:
        principalUserId:
          type: string
          example: 588f7ee98f138b19220041a7
        agentUserIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        eventId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiChatId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiToolUseId:
          type: string
        channel:
          type: string
          enum:
          - WEB
          - MOBILE
          - SLACK
          - TEAMS
          - MCP
    StockPrice:
      type: object
      required:
      - id
      - stock
      - date
      - price
      - type
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: org id that this stock price derives from
          example: 588f7ee98f138b19220041a7
        stock:
          type: string
          description: ticker symbol of this stock
          example: GOOG
        date:
          type: string
          format: date
          description: date
        price:
          type: number
          description: price per share
        type:
          type: string
          description: type of valuation
          enum:
          - COMMON_FMV
          - FUNDRAISE
          - GRANT
          - PUBLIC
        total:
          type: integer
          format: int64
          description: total shares outstanding
        updateAt:
          type: string
          description: updated timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: updated by person
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
    UpdateStockPrice:
      type: object
      properties:
        orgId:
          type: string
          description: org id that this stock price derives from
          example: 588f7ee98f138b19220041a7
        price:
          type: number
          description: price per share
        total:
          type: integer
          format: int64
          description: total shares outstanding
    AccessAction:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        fields:
          type: array
          uniqueItems: true
          items:
            type: string
        types:
          type: array
          uniqueItems: true
          items:
            type: string
    ResultsStockPrice:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockPrice'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
    ResultsAccess:
      type: object
      required:
      - allowed
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        allowed:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccessAction'
