openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Transcript API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: Transcript
paths:
  /v1/org/{orgId}/transcript:
    get:
      tags:
      - Transcript
      summary: Return transcripts in the organization
      operationId: findTranscripts
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: Only include transcripts starting at or after this timestamp (inclusive)
        required: false
        schema:
          type: string
      - name: until
        in: query
        description: Only include transcripts starting before this timestamp (exclusive)
        required: false
        schema:
          type: string
      - name: fromId
        in: query
        description: Transcript id to start paginating from
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        schema:
          type: integer
          format: int32
      - name: returnAccess
        in: query
        description: Return access information
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsTranscript'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - Transcript
      summary: Create a transcript
      operationId: createTranscript
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '201':
          description: transcript created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranscript'
        description: Transcript data to create
        required: true
  /v1/org/{orgId}/transcript/import:
    post:
      tags:
      - Transcript
      summary: Import transcripts from a JSONL file
      operationId: importTranscripts
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: import process started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: JSONL file containing transcript data
                  format: binary
              required:
              - file
  /v1/org/{orgId}/transcript/import/filepath:
    post:
      tags:
      - Transcript
      summary: Import transcripts from a JSONL file already stored (by process file path)
      operationId: importTranscriptsWithFilePath
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: filePath
        in: query
        description: path to the JSONL file in storage
        required: true
        schema:
          type: string
      - name: parentProcessId
        in: query
        description: process id of the parent process
        required: false
        schema:
          type: string
      responses:
        '200':
          description: import process started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
  /v1/org/{orgId}/transcript/{transcriptId}:
    get:
      tags:
      - Transcript
      summary: Return a particular transcript by id
      operationId: getTranscript
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: transcriptId
        in: path
        description: Transcript id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - Transcript
      summary: Update a transcript
      operationId: updateTranscript
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: transcriptId
        in: path
        description: Transcript id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: transcript updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTranscript'
        description: Transcript data to update
        required: true
    delete:
      tags:
      - Transcript
      summary: Delete a transcript
      operationId: deleteTranscript
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: transcriptId
        in: path
        description: Transcript id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: transcript deleted
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/transcript/{transcriptId}/content:
    get:
      tags:
      - Transcript
      summary: Return the transcript's content as speaker-attributed lines
      operationId: getTranscriptContent
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: transcriptId
        in: path
        description: Transcript id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsTranscriptContentLine'
        '404':
          description: not found
components:
  schemas:
    Transcript:
      type: object
      required:
      - id
      - orgId
      - externalId
      - recordingSystem
      - startAt
      - untilAt
      - attendees
      - label
      - hasTranscriptContent
      - sensitive
      properties:
        id:
          type: string
          description: globally unique id
          example: 665f3aabe88164e4ef6c3a22
        orgId:
          type: string
          description: parent organization id
          example: 665f3ad1e47a82bf1d3d180b
        calendarEntryId:
          type: string
          description: optional calendar entry ID
          example: 588f7ee98f138b19220041a7
        externalCalendarEntryId:
          type: string
          description: optional external calendar event id from the recording system (e.g. the Google Calendar event id)
        externalId:
          type: string
          description: external ID of the recording
        externalUrl:
          type: string
          description: URL to view/watch the recording on the external system
          example: https://app.gong.io/call?id=7815638069569786872
        recordingSystem:
          type: string
          description: system type used to record
          example: gong
        startAt:
          type: string
          description: timestamp of the start time (inclusive)
          example: '2017-01-24T13:57:52Z'
        untilAt:
          type: string
          description: timestamp of the ending time (exclusive)
          example: '2017-01-24T14:57:52Z'
        attendees:
          type: array
          description: list of attendees
          items:
            $ref: '#/components/schemas/TranscriptAttendee'
        tags:
          type: array
          description: tags on the transcript, such as customer name
          items:
            type: string
        language:
          type: string
          description: ISO 639-1 (two-letter) language code of the meeting
          example: en
          minItems: 0
          maxItems: 10
        label:
          type: string
          description: meeting title
          minItems: 0
          maxItems: 500
        description:
          type: string
          description: very short description of the meeting discussion (1-3 sentences)
          minItems: 0
          maxItems: 2000
        summary:
          type: string
          description: detailed summary of the meeting discussion (a few paragraphs)
          minItems: 0
          maxItems: 20000
        hasTranscriptContent:
          type: boolean
          description: whether transcript content (the JSONL utterance file) has been stored for this transcript; the content's storage location is derived from the transcript id, so no path is stored
        sensitive:
          type: string
          description: sensitivity level of the transcript
          enum:
          - GLOBAL
          - ORG
          - SENSITIVE
          - PERSONAL
          - MANAGER
          - HIGH
          - PRIVATE
        shareAccess:
          type: array
          description: list of users and groups who have the transcript shared with them
          items:
            $ref: '#/components/schemas/ShareAccess'
        createId:
          type: string
          description: created by user id
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        deleteId:
          type: string
          description: deleted by user id
          example: 588f7ee98f138b19220041a7
        deleteBehalfId:
          type: string
          description: deleted on behalf of user id
          example: 588f7ee98f138b19220041a7
        deleteAt:
          type: string
          description: deleted timestamp
          example: '2017-01-24T13:57:52Z'
    UpdateTranscript:
      type: object
      properties:
        calendarEntryId:
          type: string
          description: optional calendar entry ID
          example: 588f7ee98f138b19220041a7
        externalCalendarEntryId:
          type: string
          description: optional external calendar event id from the recording system (e.g. the Google Calendar event id)
        externalId:
          type: string
          description: external ID of the recording
        externalUrl:
          type: string
          description: URL to view/watch the recording on the external system
          example: https://app.gong.io/call?id=7815638069569786872
        recordingSystem:
          type: string
          description: system type used to record
          example: gong
        startAt:
          type: string
          description: timestamp of the start time (inclusive)
          example: '2017-01-24T13:57:52Z'
        untilAt:
          type: string
          description: timestamp of the ending time (exclusive)
          example: '2017-01-24T14:57:52Z'
        attendees:
          type: array
          description: list of attendees
          items:
            $ref: '#/components/schemas/TranscriptAttendee'
        tags:
          type: array
          description: tags on the transcript, such as customer name
          items:
            type: string
        language:
          type: string
          description: ISO 639-1 (two-letter) language code of the meeting
          example: en
          minItems: 0
          maxItems: 10
        label:
          type: string
          description: meeting title
          minItems: 0
          maxItems: 500
        description:
          type: string
          description: very short description of the meeting discussion (1-3 sentences)
          minItems: 0
          maxItems: 2000
        summary:
          type: string
          description: detailed summary of the meeting discussion (a few paragraphs)
          minItems: 0
          maxItems: 20000
        sensitive:
          type: string
          description: sensitivity level of the transcript
          enum:
          - GLOBAL
          - ORG
          - SENSITIVE
          - PERSONAL
          - MANAGER
          - HIGH
          - PRIVATE
        shareAccess:
          type: array
          description: list of users and groups who have the transcript shared with them
          items:
            $ref: '#/components/schemas/ShareAccess'
    ResultsTranscriptContentLine:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptContentLine'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
    TranscriptAttendee:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: unique speaker identifier for the transcript (equals personId if available)
        personId:
          type: string
          description: ChartHop person ID, if in the system
          example: 588f7ee98f138b19220041a7
        email:
          type: string
          description: email address, if available
        name:
          type: string
          description: display name, if available
        title:
          type: string
          description: job title, if available
        orgId:
          type: string
          description: ChartHop org ID, if available
          example: 588f7ee98f138b19220041a7
        orgName:
          type: string
          description: name of the person's organization, if available
    ResultsTranscript:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transcript'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
    ShareAccess:
      type: object
      required:
      - access
      properties:
        access:
          type: string
          description: access permission level
          enum:
          - NONE
          - LIMITED_READ
          - LIMITED_WRITE
          - STANDARD_READ
          - STANDARD_WRITE
          - COMPENSATION_READ
          - FULL_READ
          - COMP_PLANNING_PARTICIPANT
          - COMPENSATION_WRITE
          - WRITE
          - COMPENSATION_OWNER
          - OWNER
        userId:
          type: string
          description: user id
          example: 5887a7718f138b6a2a0041a7
        groupId:
          type: string
          description: group id
          example: 5887a7718f138b6a2a0041a7
        fields:
          type: string
          description: fields
          example: name,image,title
    Attribution:
      type: object
      properties:
        principalUserId:
          type: string
          example: 588f7ee98f138b19220041a7
        agentUserIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        eventId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiChatId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiToolUseId:
          type: string
        channel:
          type: string
          enum:
          - WEB
          - MOBILE
          - SLACK
          - TEAMS
          - MCP
    CreateTranscript:
      type: object
      required:
      - externalId
      - recordingSystem
      - startAt
      - untilAt
      - attendees
      - label
      - sensitive
      properties:
        calendarEntryId:
          type: string
          description: optional calendar entry ID
          example: 588f7ee98f138b19220041a7
        externalCalendarEntryId:
          type: string
          description: optional external calendar event id from the recording system (e.g. the Google Calendar event id)
        externalId:
          type: string
          description: external ID of the recording
        externalUrl:
          type: string
          description: URL to view/watch the recording on the external system
          example: https://app.gong.io/call?id=7815638069569786872
        recordingSystem:
          type: string
          description: system type used to record
          example: gong
        startAt:
          type: string
          description: timestamp of the start time (inclusive)
          example: '2017-01-24T13:57:52Z'
        untilAt:
          type: string
          description: timestamp of the ending time (exclusive)
          example: '2017-01-24T14:57:52Z'
        attendees:
          type: array
          description: list of attendees
          items:
            $ref: '#/components/schemas/TranscriptAttendee'
        tags:
          type: array
          description: tags on the transcript, such as customer name
          items:
            type: string
        language:
          type: string
          description: ISO 639-1 (two-letter) language code of the meeting
          example: en
          minItems: 0
          maxItems: 10
        label:
          type: string
          description: meeting title
          minItems: 0
          maxItems: 500
        description:
          type: string
          description: very short description of the meeting discussion (1-3 sentences)
          minItems: 0
          maxItems: 2000
        summary:
          type: string
          description: detailed summary of the meeting discussion (a few paragraphs)
          minItems: 0
          maxItems: 20000
        sensitive:
          type: string
          description: sensitivity level of the transcript
          enum:
          - GLOBAL
          - ORG
          - SENSITIVE
          - PERSONAL
          - MANAGER
          - HIGH
          - PRIVATE
        shareAccess:
          type: array
          description: list of users and groups who have the transcript shared with them
          items:
            $ref: '#/components/schemas/ShareAccess'
    Process:
      type: object
      required:
      - id
      - orgId
      - label
      - type
      - status
      - runUserId
      - createId
      - createAt
      - options
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent org id
          example: 588f7ee98f138b19220041a7
        label:
          type: string
          description: human-readable label that identifies this process
        type:
          type: string
          description: process type
        status:
          type: string
          description: current status of process
          enum:
          - PENDING
          - RUNNING
          - DONE
          - ERROR
        filePath:
          type: string
          description: data file path
        logPath:
          type: string
          description: data log path
        runUserId:
          type: string
          description: user id who is running the process
          example: 588f7ee98f138b19220041a7
        parentProcessId:
          type: string
          description: process id of parent process
          example: 588f7ee98f138b19220041a7
        createId:
          type: string
          description: created by user id (user who requested the process run)
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        startAt:
          type: string
          description: started at timestamp
          example: '2017-01-24T13:57:52Z'
        endAt:
          type: string
          description: ended at timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
          description: status or error message
        progress:
          type: number
          format: double
          description: percent progress so far
        internalError:
          type: string
          description: internal-only error message
        options:
          type: object
          description: options passed to the process
        results:
          type: object
          description: results summary for the process
          additionalProperties:
            type: object
        logDataList:
          type: array
          description: list of log data that occurred during running of this process
          items:
            $ref: '#/components/schemas/LogData'
        state:
          type: object
          description: process-specific state data
        summary:
          type: string
          description: human-readable, searchable summary of what this process did
        appId:
          type: string
          description: app id of the process
          example: 588f7ee98f138b19220041a7
        uuid:
          type: string
          description: unique ID of the process at queue time
          example: 84db3c6e-0877-4436-8af1-768c06b29586
    TranscriptContentLine:
      type: object
      required:
      - text
      properties:
        speakerId:
          type: string
          description: speaker's attendee id (matches a TranscriptAttendee.id), if known
        startAt:
          type: string
          description: when this line was spoken
          example: '2017-01-24T13:57:52Z'
        endAt:
          type: string
          description: when this line ended
          example: '2017-01-24T13:57:55Z'
        text:
          type: string
          description: the spoken text
    ResultsAccess:
      type: object
      required:
      - allowed
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        allowed:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccessAction'
    AccessAction:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        fields:
          type: array
          uniqueItems: true
          items:
            type: string
        types:
          type: array
          uniqueItems: true
          items:
            type: string
    LogData:
      type: object
      required:
      - level
      - at
      - data
      properties:
        level:
          type: string
          enum:
          - INFO
          - WARN
          - ERROR
        at:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
