  /v1/org/{orgId}/import/csv/initialColumnMatch:
    post:
      tags:
      - import
      summary: Parse a CSV file in preparation for column matching as part of spreadsheet import process
      operationId: initialColumnMatch
      consumes:
      - multipart/form-data
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: file
        in: formData
        required: true
        type: file
      responses:
        '400':
          description: bad request
        '404':
          description: not found
  /v1/org/{orgId}/import/csv/time-off-balances:
    post:
      tags:
      - import
      summary: Import time off balance data from CSV file
      operationId: importTimeOffBalances
      consumes:
      - multipart/form-data
      produces:
      - application/json
      parameters:
      - name: file
        in: formData
        required: false
        type: file
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: policyId
        in: query
        description: time off policy id to import into
        required: false
        type: string
      - name: date
        in: query
        description: effective date of the balances
        required: false
        type: string
        format: date
      responses:
        '202':
          description: successful operation
          schema:
            $ref: '#/definitions/Process'
        '400':
