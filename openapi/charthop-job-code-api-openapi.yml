openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Job Code API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: job-code
paths:
  /v1/org/{orgId}/job-code:
    get:
      tags:
      - job-code
      summary: Return all job codes in the organization paginated
      operationId: findJobCodes
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: Job code id to start paginating from
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        schema:
          type: integer
          format: int32
      - name: returnAccess
        in: query
        description: 'Return access information -- pass a list of actions to check, for example: create,update,delete'
        required: false
        schema:
          type: string
      - name: format
        in: query
        description: Data format to return fields in; default is json, can also use json-extended or json-readable
        required: false
        schema:
          type: string
      - name: filterValues
        in: query
        description: 'JSON map of field filters as {fieldId: value} to filter job codes. All filters are applied with AND logic. Field IDs must be ObjectIds of valid job code fields.'
        required: false
        schema:
          type: string
      - name: includeFieldValues
        in: query
        description: 'Whether to include fieldValues in the response (default: false)'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsJobCode'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - job-code
      summary: Create a job code
      operationId: createJobCode
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '201':
          description: job code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCode'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobCode'
        description: Job code data to create
        required: true
  /v1/org/{orgId}/job-code/export:
    post:
      tags:
      - job-code
      summary: Export job codes
      operationId: exportJobCodes
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCodeExportOptions'
        required: true
  /v1/org/{orgId}/job-code/import:
    post:
      tags:
      - job-code
      summary: Import data from CSV file
      operationId: importCsv
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: skipErrors
        in: query
        description: Whether to skip erroneous rows, or reject the entire upload if any are invalid (default)
        required: false
        schema:
          type: boolean
      responses:
        '202':
          description: start import process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid manifest data
        '401':
          description: not authorized
        '403':
          description: permission denied
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
  /v1/org/{orgId}/job-code/import/download-template:
    get:
      tags:
      - job-code
      summary: Download a CSV template for a job code import
      operationId: downloadImportCsvTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: success
        '400':
          description: bad request
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/job-code/linked-fields:
    get:
      tags:
      - job-code
      summary: Return all job code linked field IDs
      operationId: getJobCodeLinkedFields
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: jobCodeId
        in: query
        description: Job Code ID
        required: false
        schema:
          type: string
      - name: format
        in: query
        description: Data format to return fields in; default is json, can also use json-extended or json-readable
        required: false
        schema:
          type: string
      - name: date
        in: query
        description: Date to apply time tracked fields as of
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeLinkedFieldsResponse'
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/job-code/match:
    post:
      tags:
      - job-code
      summary: Start an async process that uses AI to suggest a JobCode for each job that does…
      operationId: matchJobsToJobCodes
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: matching process started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: 'Bad request. errorCode is one of: INVALID_JOB_CODE_MATCH_CATALOG_EMPTY (no job codes configured), INVALID_JOB_CODE_MATCH_CATALOG_TOO_LARGE (catalog exceeds supported size), or other validation errors (e.g. JOB_CODE_MATCH prompt not configured).'
        '401':
          description: not authorized
        '403':
          description: AI or dynamic fields not enabled for this org
        '404':
          description: org not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCodeMatchRequest'
        description: Optional list of job IDs to match. If omitted, matches all jobs without a job code.
  /v1/org/{orgId}/job-code/match/{processId}/reset:
    post:
      tags:
      - job-code
      summary: Mark a completed JobCodeMatchProcessor process as reset.
      operationId: resetJobCodeMatch
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: processId
        in: path
        description: JobCodeMatchProcessor process id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: reset flag written
        '400':
          description: process is not a JobCodeMatchProcessor
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: process not found
  /v1/org/{orgId}/job-code/{jobCodeId}:
    get:
      tags:
      - job-code
      summary: Return a particular job code by id
      operationId: getJobCode
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: jobCodeId
        in: path
        description: Job code id
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: Data format to return fields in; default is json, can also use json-extended or json-readable
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCode'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - job-code
      summary: Update an existing job code
      operationId: updateJobCode
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: jobCodeId
        in: path
        description: Job code id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: job code updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCode'
        description: Job code data to update
        required: true
    delete:
      tags:
      - job-code
      summary: Delete a job code
      operationId: deleteJobCode
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: jobCodeId
        in: path
        description: Job code id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: job code deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
components:
  schemas:
    ResultsJobCode:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobCode'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
    ResultsAccess:
      type: object
      required:
      - allowed
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        allowed:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccessAction'
    JobCode:
      type: object
      required:
      - id
      - orgId
      - title
      - code
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent organization id (empty if global)
          example: 588f7ee98f138b19220041a7
        title:
          type: string
          description: job title corresponding to this job code
          example: Data Engineer III
        code:
          type: string
          description: code of job code
          example: US-DAENG-03
        notes:
          description: description of the job code
          $ref: '#/components/schemas/TextRef'
        color:
          type: string
          description: hex color string for job code
          pattern: ^#[a-f0-9]{6}$
        image:
          type: string
          description: path to job code image
          pattern: ^[a-zA-Z0-9._/-]*$
        fieldValues:
          type: object
          additionalProperties:
            type: object
        createId:
          type: string
          description: created by user id
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        deleteId:
          type: string
          description: deleted by user id
          example: 588f7ee98f138b19220041a7
        deleteBehalfId:
          type: string
          description: deleted on behalf of user id
          example: 588f7ee98f138b19220041a7
        deleteAttribution:
          $ref: '#/components/schemas/Attribution'
        deleteAt:
          type: string
          description: deleted timestamp
          example: '2017-01-24T13:57:52Z'
    LogData:
      type: object
      required:
      - level
      - at
      - data
      properties:
        level:
          type: string
          enum:
          - INFO
          - WARN
          - ERROR
        at:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    JobCodeExportOptions:
      type: object
      properties:
        format:
          type: string
        splitColumns:
          type: boolean
    Attribution:
      type: object
      properties:
        principalUserId:
          type: string
          example: 588f7ee98f138b19220041a7
        agentUserIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        eventId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiChatId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiToolUseId:
          type: string
        channel:
          type: string
          enum:
          - WEB
          - MOBILE
          - SLACK
          - TEAMS
          - MCP
    JobCodeLinkedFieldsResponse:
      type: object
      required:
      - fields
      properties:
        fields:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        fieldValues:
          type: object
          additionalProperties:
            type: object
        jobCodeId:
          type: string
          example: 588f7ee98f138b19220041a7
        excludedOnFilledJobFields:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
    Process:
      type: object
      required:
      - id
      - orgId
      - label
      - type
      - status
      - runUserId
      - createId
      - createAt
      - options
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent org id
          example: 588f7ee98f138b19220041a7
        label:
          type: string
          description: human-readable label that identifies this process
        type:
          type: string
          description: process type
        status:
          type: string
          description: current status of process
          enum:
          - PENDING
          - RUNNING
          - DONE
          - ERROR
        filePath:
          type: string
          description: data file path
        logPath:
          type: string
          description: data log path
        runUserId:
          type: string
          description: user id who is running the process
          example: 588f7ee98f138b19220041a7
        parentProcessId:
          type: string
          description: process id of parent process
          example: 588f7ee98f138b19220041a7
        createId:
          type: string
          description: created by user id (user who requested the process run)
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        startAt:
          type: string
          description: started at timestamp
          example: '2017-01-24T13:57:52Z'
        endAt:
          type: string
          description: ended at timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
          description: status or error message
        progress:
          type: number
          format: double
          description: percent progress so far
        internalError:
          type: string
          description: internal-only error message
        options:
          type: object
          description: options passed to the process
        results:
          type: object
          description: results summary for the process
          additionalProperties:
            type: object
        logDataList:
          type: array
          description: list of log data that occurred during running of this process
          items:
            $ref: '#/components/schemas/LogData'
        state:
          type: object
          description: process-specific state data
        summary:
          type: string
          description: human-readable, searchable summary of what this process did
        appId:
          type: string
          description: app id of the process
          example: 588f7ee98f138b19220041a7
        uuid:
          type: string
          description: unique ID of the process at queue time
          example: 84db3c6e-0877-4436-8af1-768c06b29586
    JobCodeMatchRequest:
      type: object
      properties:
        jobIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        batchSize:
          type: integer
          format: int32
    TextRef:
      type: object
      properties:
        textId:
          type: string
          example: 588f7ee98f138b19220041a7
        text:
          type: string
    AccessAction:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        fields:
          type: array
          uniqueItems: true
          items:
            type: string
        types:
          type: array
          uniqueItems: true
          items:
            type: string
    CreateJobCode:
      type: object
      required:
      - orgId
      - title
      - code
      properties:
        orgId:
          type: string
          description: parent organization id (empty if global)
          example: 588f7ee98f138b19220041a7
        title:
          type: string
          description: job title corresponding to this job code
          example: Data Engineer III
        code:
          type: string
          description: code of job code
          example: US-DAENG-03
        notes:
          description: description of the job code
          $ref: '#/components/schemas/TextRef'
        color:
          type: string
          description: hex color string for job code
          pattern: ^#[a-f0-9]{6}$
        image:
          type: string
          description: path to job code image
          pattern: ^[a-zA-Z0-9._/-]*$
        fieldValues:
          type: object
          additionalProperties:
            type: object
