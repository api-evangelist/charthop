swagger: '2.0'
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop access approval API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
host: localhost
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
tags:
- name: approval
paths:
  /v1/org/{orgId}/approval-chain:
    get:
      tags:
      - approval
      summary: Return approval chains
      operationId: getApprovalChains
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: entityType
        in: query
        description: The type of entity
        required: false
        type: string
        enum:
        - COMP_REVIEW
        - SCENARIO
        - TIMEOFF
      - name: entityId
        in: query
        description: the id of the entity
        required: false
        type: string
      - name: from
        in: query
        description: Approval chain id to start paginating from
        required: false
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsApprovalChain'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - approval
      summary: Create an approval chain
      operationId: createApprovalChain
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        description: ApprovalChain data to create
        required: true
        schema:
          $ref: '#/definitions/CreateApprovalChain'
      - name: createDefaultStages
        in: query
        description: Create default stages
        required: false
        type: boolean
      responses:
        '201':
          description: approval chain created
          schema:
            $ref: '#/definitions/ApprovalChain'
        '202':
          description: snapshot currently building
        '400':
          description: bad request
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}:
    get:
      tags:
      - approval
      summary: Return a particular approval chain by id
      operationId: getApprovalChainById
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ApprovalChain'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    patch:
      tags:
      - approval
      summary: Update a approval chain
      operationId: updateApprovalChain
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: approval chain id
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateApprovalChain'
      responses:
        '202':
          description: snapshot currently building
        '400':
          description: bad request
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - approval
      summary: Delete a approval chain
      operationId: deleteApprovalChain
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      responses:
        '202':
          description: snapshot currently building
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/duplicate:
    post:
      tags:
      - approval
      summary: Duplicate an approval chain including all of its stages and settings
      operationId: duplicateApprovalChain
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id to duplicate
        required: true
        type: string
      responses:
        '201':
          description: approval chain duplicated
          schema:
            $ref: '#/definitions/ApprovalChain'
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/export:
    post:
      tags:
      - approval
      summary: Export an approval chain's stages to CSV format
      operationId: exportApprovalChain
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      responses:
        '201':
          description: process started
          schema:
            $ref: '#/definitions/Process'
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/request:
    get:
      tags:
      - approval
      summary: Return all approval requests for an approval chain
      operationId: getApprovalRequests
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: entityType
        in: query
        description: entity type to filter on
        required: false
        type: string
        enum:
        - COMP_REVIEW
        - SCENARIO
        - TIMEOFF
      - name: entityIds
        in: query
        description: entity ids to filter on
        required: false
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsApprovalRequest'
        '400':
          description: bad request
        '404':
          description: not found
    post:
      tags:
      - approval
      summary: Create an approval request
      operationId: createApprovalRequest
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: dryRun
        in: query
        description: Dry run without creating real request
        required: false
        type: boolean
      - name: previewJobId
        in: query
        description: preview-as job id
        required: false
        type: string
      - name: body
        in: body
        description: Approval request data to create
        required: true
        schema:
          $ref: '#/definitions/ApprovalRequestCreateBody'
      responses:
        '201':
          description: approval request created
          schema:
            $ref: '#/definitions/ApprovalRequest'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/request/entity/comp-review:
    get:
      tags:
      - approval
      summary: Return all approval request comp review responses for an approval chain
      operationId: getApprovalRequestResponsesByCompReview
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: entityIds
        in: query
        description: entity ids to filter on
        required: true
        type: array
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsApprovalRequestCompReviewResponse'
        '400':
          description: bad request
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/request/entity/scenario:
    get:
      tags:
      - approval
      summary: Return all approval request scenario responses for an approval chain
      operationId: getApprovalRequestResponsesByScenario
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: entityIds
        in: query
        description: entity ids to filter on
        required: false
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsApprovalRequestScenarioResponse'
        '400':
          description: bad request
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/request/{approvalRequestId}:
    get:
      tags:
      - approval
      summary: Return an approval request
      operationId: getApprovalRequest
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalRequestId
        in: path
        description: Approval request id
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ApprovalRequest'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - approval
      summary: Update an existing approval request
      operationId: updateApprovalRequest
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalRequestId
        in: path
        description: approval request id
        required: true
        type: string
      - name: previewJobId
        in: query
        description: preview-as job id
        required: false
        type: string
      - name: targetApproverJobId
        in: query
        description: jobId of the approver the caller is acting for as their approval delegate
        required: false
        type: string
      - name: body
        in: body
        description: approval request data to update
        required: true
        schema:
          $ref: '#/definitions/ApprovalRequestPatchBody'
      responses:
        '204':
          description: approval request updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - approval
      summary: Delete an approval request
      operationId: deleteApprovalRequest
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalRequestId
        in: path
        description: Approval request id
        required: true
        type: string
      - name: body
        in: body
        description: Body params for deletion
        required: true
        schema:
          $ref: '#/definitions/ApprovalRequestDeleteBody'
      responses:
        '202':
          description: snapshot currently building
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/request/{approvalRequestId}/reassign-approver:
    post:
      tags:
      - approval
      summary: Reassigning an approver at a stage
      operationId: reassignApproverAtStage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalRequestId
        in: path
        description: approval request id
        required: true
        type: string
      - name: body
        in: body
        description: approval request data to update
        required: true
        schema:
          $ref: '#/definitions/ReassignApproverPatchBody'
      responses:
        '204':
          description: approver reassigned
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/request/{approvalRequestId}/send-reminder:
    post:
      tags:
      - approval
      summary: Send a reminder for a stage reviewer in an existing approval request
      operationId: sendReminder
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalRequestId
        in: path
        description: approval request id
        required: true
        type: string
      - name: body
        in: body
        description: reminder body
        required: true
        schema:
          $ref: '#/definitions/SendReminderBody'
      responses:
        '200':
          description: reminder sent
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/stage:
    get:
      tags:
      - approval
      summary: Return all approval chain stages for an approval chain
      operationId: getApprovalChainStages
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsApprovalChainStage'
        '400':
          description: bad request
        '404':
          description: not found
    post:
      tags:
      - approval
      summary: Create an approval chain stage
      operationId: createApprovalChainStage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: body
        in: body
        description: Approval chain stage data to create
        required: true
        schema:
          $ref: '#/definitions/CreateApprovalChainStage'
      responses:
        '201':
          description: approval chain stage created
          schema:
            $ref: '#/definitions/ApprovalChainStage'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
  /v1/org/{orgId}/approval-chain/{approvalChainId}/stage/{approvalChainStageId}:
    get:
      tags:
      - approval
      summary: Return all approval chain stages for an approval chain
      operationId: getApprovalChainStage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalChainStageId
        in: path
        description: Approval chain stage id
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ApprovalChainStage'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - approval
      summary: Update an existing approval chain stage
      operationId: updateApprovalChainStage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalChainStageId
        in: path
        description: approval chain stage id
        required: true
        type: string
      - name: body
        in: body
        description: approval chain stage data to update
        required: true
        schema:
          $ref: '#/definitions/UpdateApprovalChainStage'
      responses:
        '204':
          description: approval chain stage updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - approval
      summary: Delete an approval chain stage
      operationId: deleteApprovalChainStage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: approvalChainId
        in: path
        description: Approval chain id
        required: true
        type: string
      - name: approvalChainStageId
        in: path
        description: Approval chain stage id
        required: true
        type: string
      responses:
        '202':
          description: snapshot currently building
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
definitions:
  ApprovalGroup:
    type: object
    required:
    - type
    - approvers
    properties:
      groupId:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      type:
        type: string
        description: What type of group this is
        enum:
        - REVIEWER
        - COLLABORATOR
        - FINAL_APPROVER
      approvers:
        type: array
        description: approvers that make up the group
        items:
          $ref: '#/definitions/ApprovalGroupApprover'
      expandExpression:
        type: string
        description: optional custom expression to determine approval request tree
      minApproversNeeded:
        type: integer
        format: int32
        description: minimum number of approvers required in this group for approval (null means all approvers required)
  LogData:
    type: object
    required:
    - level
    - at
    - data
    properties:
      level:
        type: string
        enum:
        - INFO
        - WARN
        - ERROR
      at:
        type: string
        description: created timestamp
        example: '2017-01-24T13:57:52Z'
      message:
        type: string
      data:
        type: object
        additionalProperties:
          type: object
  ApprovalRequestPatchBody:
    type: object
    required:
    - status
    properties:
      status:
        type: string
        enum:
        - CANCELED
        - REJECTED
        - PENDING
        - ACTIVE
        - REVIEWED
        - APPROVED
        - SKIPPED
        - SUBMITTED
      message:
        type: string
  ApprovalNotifierGroup:
    type: object
    required:
    - groupId
    - userIds
    properties:
      groupId:
        type: string
        description: globally unique id for this notifier group
        example: 588f7ee98f138b19220041a7
      userIds:
        type: array
        description: user ids to notify in this group
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      inclusionBehavior:
        type: string
        description: condition behavior for this notifier group; null means always notify
        enum:
        - ONLY_INCLUDE_IF
        - EXCLUDE_IF
      inclusionExpression:
        type: string
        description: expression to evaluate for conditional notification
  ApprovalGroupApprover:
    type: object
    required:
    - jobId
    - status
    properties:
      jobId:
        type: string
        description: A job ID that is part of the group
        example: 588f7ee98f138b19220041a7
      status:
        type: string
        description: The status of the approver
        enum:
        - PENDING
        - APPROVED
        - REJECTED
        - SKIPPED
      commentId:
        type: string
        description: Last comment of the approver
        example: 588f7ee98f138b19220041a7
      reassignCommentId:
        type: string
        description: Last comment associated with a reassignment
        example: 588f7ee98f138b19220041a7
      isFallback:
        type: boolean
        description: Whether approver is a fallback
      fallbackFor:
        type: string
        description: What jobId approver is a fallback for
        example: 588f7ee98f138b19220041a7
      actedByJobId:
        type: string
        description: Job of the delegate who acted on this slot on the approver's behalf
        example: 588f7ee98f138b19220041a7
      updateAt:
        type: string
        description: The date the status was updated last
  UpdateApprovalChainStage:
    type: object
    properties:
      inclusionExpression:
        type: string
        description: optional custom expression to determine stage inclusion behavior
      inclusionBehavior:
        type: string
        description: determines whether stage is conditional based on an expression
        enum:
        - ONLY_INCLUDE_IF
        - EXCLUDE_IF
      rejectBehavior:
        type: string
        description: determines which stage becomes active when a rejection event happens
        enum:
        - BACK_TO_BEGINNING
        - PREVIOUS_PHASE
      dynamicStagesExpression:
        type: string
        description: if set to an expression that returns jobs or persons, the result of this expression will be expanded into multiple approval stages. For example, if set to `managerPersons`, then one stage will be created for each manager of the requester
      status:
        type: string
        description: status of the stage
        enum:
        - CANCELED
        - REJECTED
        - PENDING
        - ACTIVE
        - REVIEWED
        - APPROVED
        - SKIPPED
        - SUBMITTED
      approvalCommentRequired:
        type: boolean
        description: requires a comment on an approval event
      rejectionCommentRequired:
        type: boolean
        description: requires a comment on an rejection event
      order:
        type: integer
        format: int32
        description: order of stage in approval chain
      groups:
        type: array
        description: list of groups that are involved in this approval stage
        items:
          $ref: '#/definitions/ApprovalGroup'
      autoApproveIfApproverIsSubmitter:
        type: boolean
        description: if true, when an approver in this stage equals the scenario submitter, that approver is auto-approved at request creation time. If every approver matches the submitter, the entire stage is auto-approved.
  ResultsApprovalRequestCompReviewResponse:
    type: object
    required:
    - data
    properties:
      data:
        type: array
        items:
          $ref: '#/definitions/ApprovalRequestCompReviewResponse'
      next:
        type: string
      access:
        type: array
        items:
          $ref: '#/definitions/ResultsAccess'
  ApprovalRequestDeleteBody:
    type: object
    properties:
      message:
        type: string
  AccessAction:
