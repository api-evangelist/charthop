openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop MCP API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: MCP
paths:
  /mcp/{agent}:
    post:
      tags:
      - MCP
      summary: Org-less MCP server message endpoint (JSON-RPC 2.0 over Streamable HTTP)
      operationId: handleMessageNoOrg
      parameters:
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
        '202':
          description: notification accepted
        '401':
          description: not authorized
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
    get:
      tags:
      - MCP
      summary: Org-less MCP server SSE stream (not supported)
      operationId: streamNoOrg
      parameters:
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '405':
          description: method not allowed
  /mcp/{agent}/{orgId}:
    post:
      tags:
      - MCP
      summary: MCP server message endpoint (JSON-RPC 2.0 over Streamable HTTP)
      operationId: handleMessageForOrg
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
        '202':
          description: notification accepted
        '401':
          description: not authorized
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
    get:
      tags:
      - MCP
      summary: MCP server SSE stream (not supported)
      operationId: stream
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '405':
          description: method not allowed
