swagger: '2.0'
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop access data-view API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
host: localhost
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
tags:
- name: data-view
paths:
  /v1/org/{orgId}/data-view:
    get:
      tags:
      - data-view
      summary: Return all data views in the organization paginated
      operationId: findDataViews
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: from
        in: query
        description: Data view id to start paginating from
        required: false
        type: string
      - name: type
        in: query
        description: Data view type to filter by
        required: false
        type: string
        enum:
        - ANY
        - DATA_SHEET
        - ORG_CHART
        - MAP
        - CALIBRATION
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: ids
        in: query
        description: Comma delimited of ids to return
        required: false
        type: string
      - name: returnAccess
        in: query
        description: 'Return access information -- pass a list of actions to check, for example: create,update,delete'
        required: false
        type: string
      - name: entityId
        in: query
        description: Filter by associated entity id (e.g. assessment id)
        required: false
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsDataView'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - data-view
      summary: Create a data view
      operationId: createDataView
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        description: Data view data to create
        required: true
        schema:
          $ref: '#/definitions/CreateDataView'
      responses:
        '201':
          description: data view created
          schema:
            $ref: '#/definitions/DataView'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
  /v1/org/{orgId}/data-view/{dataViewId}:
    get:
      tags:
      - data-view
      summary: Return a particular data view by id
      operationId: getDataView
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: dataViewId
        in: path
        description: Data view id
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/DataView'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - data-view
      summary: Update an existing data view
      operationId: updateDataView
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: dataViewId
        in: path
        description: Data view id
        required: true
        type: string
      - name: body
        in: body
        description: Data view data to update
        required: true
        schema:
          $ref: '#/definitions/UpdateDataView'
      responses:
        '200':
          description: data view updated
          schema:
            $ref: '#/definitions/DataView'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - data-view
      summary: Delete a data  view
      operationId: deleteDataView
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: dataViewId
        in: path
        description: Data view id
        required: true
        type: string
      responses:
        '204':
          description: data view deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
definitions:
  AccessAction:
    type: object
    required:
    - action
    properties:
      action:
        type: string
      fields:
        type: array
        uniqueItems: true
        items:
          type: string
      types:
        type: array
        uniqueItems: true
        items:
          type: string
  ResultsDataView:
    type: object
    required:
    - data
    properties:
      data:
        type: array
        items:
          $ref: '#/definitions/DataView'
      next:
        type: string
      access:
        type: array
        items:
          $ref: '#/definitions/ResultsAccess'
  ResultsAccess:
    type: object
    required:
    - allowed
    properties:
      ids:
        type: array
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      allowed:
        type: array
        uniqueItems: true
        items:
          $ref: '#/definitions/AccessAction'
  Attribution:
    type: object
    properties:
      principalUserId:
        type: string
        example: 588f7ee98f138b19220041a7
      agentUserIds:
        type: array
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      eventId:
        type: string
        example: 588f7ee98f138b19220041a7
      aiChatId:
        type: string
        example: 588f7ee98f138b19220041a7
      aiToolUseId:
        type: string
      channel:
        type: string
        enum:
        - WEB
        - MOBILE
        - SLACK
        - TEAMS
        - MCP
  ShareAccess:
    type: object
    required:
    - access
    properties:
      access:
        type: string
        description: access permission level
        enum:
        - NONE
        - LIMITED_READ
        - LIMITED_WRITE
        - STANDARD_READ
        - STANDARD_WRITE
        - COMPENSATION_READ
        - FULL_READ
        - COMP_PLANNING_PARTICIPANT
        - COMPENSATION_WRITE
        - WRITE
        - COMPENSATION_OWNER
        - OWNER
      userId:
        type: string
        description: user id
        example: 5887a7718f138b6a2a0041a7
      groupId:
        type: string
        description: group id
        example: 5887a7718f138b6a2a0041a7
      fields:
        type: string
        description: fields
        example: name,image,title
  DataViewColumn:
    type: object
    properties:
      name:
        type: string
      label:
        type: string
      expr:
        type: string
  DataView:
    type: object
    required:
    - id
    - orgId
    - name
    - slug
    properties:
      id:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id
        example: 588f7ee98f138b19220041a7
      name:
        type: string
        description: data view name
        minItems: 1
        maxItems: 1000
      slug:
        type: string
        description: slug for URL
        readOnly: true
      columns:
        type: string
        description: comma delimited list of columns (deprecated, prefer using dataColumns)
        example: image,name,title
        minItems: 1
        maxItems: 5000
      dataColumns:
        type: array
        description: list of columns
        items:
          $ref: '#/definitions/DataViewColumn'
      type:
        type: string
        description: type of data view
        enum:
        - ANY
        - DATA_SHEET
        - ORG_CHART
        - MAP
        - CALIBRATION
      entityType:
        type: string
        description: entity type being viewed
        enum:
        - ACTION
        - AGREEMENT
        - AI_AGENT
        - AI_AGENT_MEMORY
        - AI_CHAT
        - AI_CONFIG
        - AI_CREDIT_LIMIT
        - AI_CREDIT_USAGE
        - AI_HINT
        - AI_PROMPT
