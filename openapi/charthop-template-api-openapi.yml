openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Template API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: Template
paths:
  /v1/org/{orgId}/template:
    get:
      tags:
      - Template
      summary: Return all templates in the organization paginated
      operationId: findTemplates
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Type of template to filter by
        required: false
        schema:
          type: string
          enum:
          - DOCUMENT
          - EMAIL
      - name: from
        in: query
        description: Template id to start paginating from
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsTemplate'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - Template
      summary: Create a template
      operationId: createTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '201':
          description: template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplate'
        description: Template data to create
        required: true
  /v1/org/{orgId}/template/bulk/delete:
    post:
      tags:
      - Template
      summary: Delete a set of templates
      operationId: bulkDeleteTemplates
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                example: 588f7ee98f138b19220041a7
        description: List of template ids to delete
        required: true
  /v1/org/{orgId}/template/bulk/duplicate:
    post:
      tags:
      - Template
      summary: Duplicate a set of templates
      operationId: bulkDuplicateTemplates
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                example: 588f7ee98f138b19220041a7
        description: List of template ids to duplicate
        required: true
  /v1/org/{orgId}/template/email:
    post:
      tags:
      - Template
      summary: Create a template
      operationId: createEmailTemplate
      responses:
        '201':
          description: template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplate'
        description: Template data to create
        required: true
  /v1/org/{orgId}/template/email/{templateName}:
    get:
      tags:
      - Template
      summary: Return a particular email template by name
      operationId: getEmailTemplate
      parameters:
      - name: templateName
        in: path
        description: Template name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: bad request
        '404':
          description: not found
    delete:
      tags:
      - Template
      summary: Delete a template
      operationId: deleteEmailTemplate
      parameters:
      - name: templateName
        in: path
        description: Template name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: template deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    patch:
      tags:
      - Template
      summary: Update an existing template
      operationId: updateEmailTemplate
      parameters:
      - name: templateName
        in: path
        description: Template name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: template updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplate'
        description: Template data to update
        required: true
  /v1/org/{orgId}/template/{templateId}:
    get:
      tags:
      - Template
      summary: Return a particular template by id
      operationId: getTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: Template id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - Template
      summary: Update an existing template
      operationId: updateTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: Template id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: template updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplate'
        description: Template data to update
        required: true
    delete:
      tags:
      - Template
      summary: Delete a template
      operationId: deleteTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: Template id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: template deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/template/{templateId}/download:
    get:
      tags:
      - Template
      summary: If the template is a file template, download the file
      operationId: downloadTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: Template id
        required: true
        schema:
          type: string
      responses:
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/template/{templateId}/generate:
    post:
      tags:
      - Template
      summary: Automatically generate PDFs of the templates, and distribute emails to managers…
      operationId: generateTemplates
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: Template id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTemplateRequest'
        required: true
  /v1/org/{orgId}/template/{templateId}/preview:
    post:
      tags:
      - Template
      summary: Preview template content without saving it
      operationId: previewTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: jobId
        in: query
        description: Job id
        required: false
        schema:
          type: string
      - name: scenarioId
        in: query
        description: Scenario id to query
        required: false
        schema:
          type: string
      - name: date
        in: query
        description: Date
        required: false
        schema:
          type: string
          format: date
      - name: format
        in: query
        description: Format
        required: true
        schema:
          type: string
          enum:
          - TEXT
          - HTML
          - PDF
          default: TEXT
      - name: changeGroupingType
        in: query
        description: Type of change grouping
        required: false
        schema:
          type: string
          enum:
          - PRIMARY
          - SCENARIO
          - COMP_REVIEW
      - name: changeGroupingId
        in: query
        description: Change grouping id to query (null for primary)
        required: false
        schema:
          type: string
      - name: useScenarioChanges
        in: query
        description: Generate documents for only the changes that are in the scenario. This option also allows you to reference the change within the template, which is otherwise not allowed
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: template previewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRenderResponse'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePreviewRequest'
        required: true
  /v1/org/{orgId}/template/{templateId}/render:
    post:
      tags:
      - Template
      summary: Render a template by evaluating it against an existing job
      operationId: renderTemplate
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: Template id
        required: true
        schema:
          type: string
      - name: jobId
        in: query
        description: Job id
        required: false
        schema:
          type: string
      - name: scenarioId
        in: query
        description: Scenario id to query
        required: false
        schema:
          type: string
      - name: date
        in: query
        description: Date
        required: false
        schema:
          type: string
          format: date
      - name: format
        in: query
        description: Format
        required: true
        schema:
          type: string
          enum:
          - TEXT
          - HTML
          - PDF
          default: TEXT
      - name: changeGroupingType
        in: query
        description: Type of change grouping
        required: false
        schema:
          type: string
          enum:
          - PRIMARY
          - SCENARIO
          - COMP_REVIEW
      - name: changeGroupingId
        in: query
        description: Change grouping id to query (null for primary)
        required: false
        schema:
          type: string
      - name: useScenarioChanges
        in: query
        description: Generate documents for only the changes that are in the scenario. This option also allows you to reference the change within the template, which is otherwise not allowed
        required: false
        schema:
          type: boolean
      responses:
        '201':
          description: template rendered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRenderResponse'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
components:
  schemas:
    SignaturePlacement:
      type: object
      required:
      - type
      - x
      - y
      - pageNumber
      properties:
        type:
          type: string
          description: the kind of placement
          enum:
          - SIGNATURE
          - NAME
          - TITLE
          - DATE
          - EXPR
        x:
          type: number
          format: float
          description: horizontal position as a fraction (0..1) of page width, from the left edge
        y:
          type: number
          format: float
          description: vertical position as a fraction (0..1) of page height, from the top edge
        pageNumber:
          type: integer
          format: int32
          description: 1-based page number the placement is anchored to
        width:
          type: number
          format: float
          description: optional width as a fraction (0..1) of page width, reserved for future use
        height:
          type: number
          format: float
          description: optional height as a fraction (0..1) of page height, reserved for future use
        expr:
          type: string
          description: carrot expression evaluated against the document's person; required for EXPR placements
        signerNumber:
          type: integer
          format: int32
          description: 1-based signer this placement binds to; when null, the placement is assigned to a signer by position
    ResultsTemplate:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
    UpdateTemplate:
      type: object
      properties:
        name:
          type: string
          description: template name, must be unique to organization
        description:
          type: string
          description: description of template
        content:
          type: string
          description: template content
        stylesheet:
          type: string
          description: template inline stylesheet
        fileId:
          type: string
          description: file identifier, if the template is based on a PDF file instead of a CQLT template
          example: 588f7ee98f138b19220041a7
        placements:
          type: array
          description: signature zone placements for a file-based template; only valid when fileId is set
          items:
            $ref: '#/components/schemas/SignaturePlacement'
        type:
          type: string
          description: type of template
          enum:
          - DOCUMENT
          - EMAIL
        tags:
          type: array
          description: tags to organize the purpose of the template
          items:
            type: string
        filename:
          type: string
          description: document filename CQL
        fieldId:
          type: string
          description: the field id that will be used to store documents generated by this template
          example: 588f7ee98f138b19220041a7
        qesFilter:
          type: string
          description: filter expression evaluated on each signer for whether to use qualified electronic signature (if it evalutes to true for any signer, QES will be used). If null, defaults to org `qesFilter` setting
        isSequential:
          type: boolean
          description: whether signers must sign in sequential order; false (the default) means simultaneous signing
    TemplateRenderResponse:
      type: object
      required:
      - content
      properties:
        content:
          type: string
    Attribution:
      type: object
      properties:
        principalUserId:
          type: string
          example: 588f7ee98f138b19220041a7
        agentUserIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        eventId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiChatId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiToolUseId:
          type: string
        channel:
          type: string
          enum:
          - WEB
          - MOBILE
          - SLACK
          - TEAMS
          - MCP
    Process:
      type: object
      required:
      - id
      - orgId
      - label
      - type
      - status
      - runUserId
      - createId
      - createAt
      - options
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent org id
          example: 588f7ee98f138b19220041a7
        label:
          type: string
          description: human-readable label that identifies this process
        type:
          type: string
          description: process type
        status:
          type: string
          description: current status of process
          enum:
          - PENDING
          - RUNNING
          - DONE
          - ERROR
        filePath:
          type: string
          description: data file path
        logPath:
          type: string
          description: data log path
        runUserId:
          type: string
          description: user id who is running the process
          example: 588f7ee98f138b19220041a7
        parentProcessId:
          type: string
          description: process id of parent process
          example: 588f7ee98f138b19220041a7
        createId:
          type: string
          description: created by user id (user who requested the process run)
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        startAt:
          type: string
          description: started at timestamp
          example: '2017-01-24T13:57:52Z'
        endAt:
          type: string
          description: ended at timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
          description: status or error message
        progress:
          type: number
          format: double
          description: percent progress so far
        internalError:
          type: string
          description: internal-only error message
        options:
          type: object
          description: options passed to the process
        results:
          type: object
          description: results summary for the process
          additionalProperties:
            type: object
        logDataList:
          type: array
          description: list of log data that occurred during running of this process
          items:
            $ref: '#/components/schemas/LogData'
        state:
          type: object
          description: process-specific state data
        summary:
          type: string
          description: human-readable, searchable summary of what this process did
        appId:
          type: string
          description: app id of the process
          example: 588f7ee98f138b19220041a7
        uuid:
          type: string
          description: unique ID of the process at queue time
          example: 84db3c6e-0877-4436-8af1-768c06b29586
    CreateTemplate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: template name, must be unique to organization
        description:
          type: string
          description: description of template
        content:
          type: string
          description: template content
        stylesheet:
          type: string
          description: template inline stylesheet
        fileId:
          type: string
          description: file identifier, if the template is based on a PDF file instead of a CQLT template
          example: 588f7ee98f138b19220041a7
        placements:
          type: array
          description: signature zone placements for a file-based template; only valid when fileId is set
          items:
            $ref: '#/components/schemas/SignaturePlacement'
        type:
          type: string
          description: type of template
          enum:
          - DOCUMENT
          - EMAIL
        tags:
          type: array
          description: tags to organize the purpose of the template
          items:
            type: string
        filename:
          type: string
          description: document filename CQL
        fieldId:
          type: string
          description: the field id that will be used to store documents generated by this template
          example: 588f7ee98f138b19220041a7
        qesFilter:
          type: string
          description: filter expression evaluated on each signer for whether to use qualified electronic signature (if it evalutes to true for any signer, QES will be used). If null, defaults to org `qesFilter` setting
        isSequential:
          type: boolean
          description: whether signers must sign in sequential order; false (the default) means simultaneous signing
    Template:
      type: object
      required:
      - id
      - orgId
      - name
      - type
      - tags
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent organization id
          example: 588f7ee98f138b19220041a7
        name:
          type: string
          description: template name, must be unique to organization
        description:
          type: string
          description: description of template
        content:
          type: string
          description: template content
        stylesheet:
          type: string
          description: template inline stylesheet
        fileId:
          type: string
          description: file identifier, if the template is based on a PDF file instead of a CQLT template
          example: 588f7ee98f138b19220041a7
        placements:
          type: array
          description: signature zone placements for a file-based template; only valid when fileId is set
          items:
            $ref: '#/components/schemas/SignaturePlacement'
        type:
          type: string
          description: type of template
          enum:
          - DOCUMENT
          - EMAIL
        tags:
          type: array
          description: tags to organize the purpose of the template
          items:
            type: string
        filename:
          type: string
          description: document filename CQL
        fieldId:
          type: string
          description: the field id that will be used to store documents generated by this template
          example: 588f7ee98f138b19220041a7
        qesFilter:
          type: string
          description: filter expression evaluated on each signer for whether to use qualified electronic signature (if it evalutes to true for any signer, QES will be used). If null, defaults to org `qesFilter` setting
        isSequential:
          type: boolean
          description: whether signers must sign in sequential order; false (the default) means simultaneous signing
        createId:
          type: string
          description: created by user id
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
        deleteId:
          type: string
          description: deleted by user id
          example: 588f7ee98f138b19220041a7
        deleteBehalfId:
          type: string
          description: deleted on behalf of user id
          example: 588f7ee98f138b19220041a7
        deleteAttribution:
          $ref: '#/components/schemas/Attribution'
        deleteAt:
          type: string
          description: deleted timestamp
          example: '2017-01-24T13:57:52Z'
    TemplatePreviewRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
        stylesheet:
          type: string
    ResultsAccess:
      type: object
      required:
      - allowed
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        allowed:
          type: array
