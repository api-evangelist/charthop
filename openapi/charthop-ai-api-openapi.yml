swagger: '2.0'
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop access ai API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
host: localhost
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
tags:
- name: ai
paths:
  /v1/org/{orgId}/ai/agent-memory:
    get:
      tags:
      - ai
      summary: List memories for an agent
      operationId: listMemories
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: agentUserId
        in: query
        description: Agent user ID
        required: false
        type: string
      - name: userId
        in: query
        description: User ID (defaults to current user)
        required: false
        type: string
      - name: actionId
        in: query
        description: Action ID, if filtering for a particular action
        required: false
        type: string
      responses:
        '200':
          description: successful operation
        '401':
          description: not authorized
        '403':
          description: permission denied
    post:
      tags:
      - ai
      summary: Create a new memory
      operationId: createMemory
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/CreateAiAgentMemory'
      responses:
        '201':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
  /v1/org/{orgId}/ai/agent-memory/{memoryId}:
    get:
      tags:
      - ai
      summary: Get a single memory
      operationId: getMemory
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: memoryId
        in: path
        description: Memory ID
        required: true
        type: string
      responses:
        '200':
          description: successful operation
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    patch:
      tags:
      - ai
      summary: Update a memory
      operationId: updateMemory
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: memoryId
        in: path
        description: Memory ID
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateAiAgentMemory'
      responses:
        '204':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - ai
      summary: Delete a memory
      operationId: deleteMemory
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: memoryId
        in: path
        description: Memory ID
        required: true
        type: string
      responses:
        '204':
          description: successful operation
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat:
    post:
      tags:
      - ai
      summary: Start a new AI chat with an initial message or question
      operationId: startChat
      consumes:
      - application/json
      produces:
      - text/event-stream
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiChatRequest'
      responses:
        '201':
          description: successful operation
          schema:
            $ref: '#/definitions/AiChat'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    get:
      tags:
      - ai
      summary: Retrieve previous AI chats
      operationId: findChats
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: userId
        in: query
        description: User id
        required: false
        type: string
      - name: agentUserId
        in: query
        description: Filter by agent user id
        required: false
        type: string
      - name: fromAt
        in: query
        description: Timestamp to search from
        required: false
        type: string
      - name: untilAt
        in: query
        description: Timestamp to search up until
        required: false
        type: string
      - name: from
        in: query
        description: Identifier to paginate from
        required: false
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: sort
        in: query
        description: Sort by (default is createAt, can also use updateAt)
        required: false
        type: string
      - name: returnAccess
        in: query
        description: 'Return access information -- pass a list of actions to check, for example: create,update,delete'
        required: false
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsAiChat'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/prompt-suggest:
    get:
      tags:
      - ai
      summary: Retrieve some suggested prompts for starting an AI chat
      operationId: getSuggestedPrompts
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: limit
        in: query
        description: Number of suggestions to return (defaults to 5)
        required: false
        type: integer
        format: int32
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/AiSuggestedPromptsResponse'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/top-users:
    get:
      tags:
      - ai
      summary: Find users with the most AI chats over a date range
      operationId: findTopUsers
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: startDate
        in: query
        description: Start date (inclusive)
        required: false
        type: string
        format: date
      - name: endDate
        in: query
        description: End date (inclusive)
        required: false
        type: string
        format: date
      - name: fields
        in: query
        description: Fields to retrieve, comma-separated
        required: false
        type: string
      - name: format
        in: query
        description: Data format to use; default is json, can also use json-extended or json-readable
        required: false
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: filter
        in: query
        description: CQL filter to apply on the person
        required: false
        type: string
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}:
    get:
      tags:
      - ai
      summary: Retrieve a previous AI chat
      operationId: getChat
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/AiChat'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    patch:
      tags:
      - ai
      summary: Update an existing AI chat's metadata, such as label or shareAccess information
      operationId: updateChat
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: body
        in: body
        description: Chat data to update
        required: true
        schema:
          $ref: '#/definitions/UpdateAiChat'
      responses:
        '204':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - ai
      summary: Delete an AI chat
      operationId: deleteChat
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      responses:
        '204':
          description: chat deleted
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}/answer-tool:
    post:
      tags:
      - ai
      summary: Answer a pending AskUserQuestion tool call in an AI chat
      operationId: answerToolQuestion
      consumes:
      - application/json
      produces:
      - text/event-stream
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiChatAnswerToolRequest'
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}/approve-tool:
    post:
      tags:
      - ai
      summary: Approve pending tool calls in an AI chat
      operationId: approveToolUses
      consumes:
      - application/json
      produces:
      - text/event-stream
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiChatApproveToolRequest'
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}/message:
    post:
      tags:
      - ai
      summary: Send an additional message to an existing AI chat
      operationId: sendMessageToChat
      consumes:
      - application/json
      produces:
      - text/event-stream
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiChatRequest'
      responses:
        '201':
          description: successful operation
          schema:
            $ref: '#/definitions/AiChatMessage'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}/message/{messageId}:
    get:
      tags:
      - ai
      summary: Retrieve an individual message from an existing AI chat
      operationId: getChatMessage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: messageId
        in: path
        description: Message identifier
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/AiChatMessage'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}/message/{messageId}/feedback:
    post:
      tags:
      - ai
      summary: Send feedback on a message in an AI chat
      operationId: sendChatMessageFeedback
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: messageId
        in: path
        description: Message identifier
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiChatFeedback'
      responses:
        '204':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/chat/{chatId}/reject-tool:
    post:
      tags:
      - ai
      summary: Reject pending tool calls in an AI chat
      operationId: rejectToolUses
      consumes:
      - application/json
      produces:
      - text/event-stream
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: chatId
        in: path
        description: Chat identifier
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiChatRejectToolRequest'
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/config:
    patch:
      tags:
      - ai
      summary: Update configuration of AI models for this org (ChartHop staff only)
      operationId: configureModelForOrg
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateAiConfig'
      responses:
        '200':
          description: successful operation
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/form-response/summary:
    post:
      tags:
      - ai
      summary: Use AI to generate a summary of text form responses
      operationId: summarizeFormResponses
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/SummarizeFormResponsesRequest'
      responses:
        '204':
          description: successful operation
          schema:
            $ref: '#/definitions/SummarizeResponse'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/translate:
    post:
      tags:
      - ai
      summary: Translate from one language to another using AI
      operationId: translate
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiTranslateRequest'
      responses:
        '204':
          description: successful operation
          schema:
            $ref: '#/definitions/AiTranslateResponse'
        '400':
          description: invalid request
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/translate/detect-language:
    post:
      tags:
      - ai
      summary: Detect the dominant language of a text
      operationId: detectLanguage
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/DetectLanguageRequest'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/DetectLanguageResponse'
        '400':
          description: invalid request
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/ai/translate/expression:
    post:
      tags:
      - ai
      summary: Translate natural language into a CQL filter expression
      operationId: translateExpression
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AiExpressionTranslateRequest'
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/AiExpressionTranslateResponse'
        '400':
          description: invalid request
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - ai
      summary: Invalidate all cached expression translation responses
      operationId: invalidateExpressionTranslations
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      responses:
        '204':
          description: successful operation
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
definitions:
  AiSuggestedPromptsResponse:
    type: object
    required:
    - prompts
    properties:
      prompts:
        type: array
        items:
          type: string
  AiChatMessageBlock:
    type: object
    properties:
      dataContextMessage:
        type: string
      contextMessage:
        type: string
      message:
        type: string
      toolUse:
        $ref: '#/definitions/AiToolUse'
      toolResult:
        $ref: '#/definitions/AiToolResult'
  UpdateAiChat:
    type: object
    properties:
      label:
        type: string
        description: label for the chat (defaults to the first question asked)
      shareAccess:
        type: array
        description: users who are specifically granted permission to view or edit this chat
        items:
          $ref: '#/definitions/ShareAccess'
  AiChatAnswerToolRequest:
    type: object
    required:
    - toolUseId
    - answers
    properties:
      toolUseId:
        type: string
      answers:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      message:
        type: string
  AccessAction:
    type: object
    required:
    - action
    properties:
      action:
        type: string
      fields:
        type: array
        uniqueItems: true
        items:
          type: string
      types:
        type: array
        uniqueItems: true
        items:
          type: string
  AiChat:
    type: object
    required:
    - id
    - orgId
    - type
    - mode
    - userId
    - agentUserId
    - shareAccess
    properties:
      id:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id
        example: 588f7ee98f138b19220041a7
      type:
        type: string
        description: the type of the chat
        enum:
        - OWNER
        - INTERNAL
        - STAFF
        - CUSTOMER
        - DEMO
        - TEST
      mode:
        type: string
        description: the mode of the chat -- CHAT is an interactive chat, while AUTO is an autonomous action
        enum:
        - CHAT
        - AUTO
      userId:
        type: string
        description: user id who initiated the chat
        example: 588f7ee98f138b19220041a7
      agentUserId:
        type: string
        description: AI agent user id who is participating in the chat
        example: 588f7ee98f138b19220041a7
      behalfUserId:
        type: string
        description: user id this chat was created on behalf of, when an agent initiated it (userId is then the initiating agent)
        example: 588f7ee98f138b19220041a7
      modelId:
        type: string
        description: model that was used in the chat
      aiPromptId:
        type: string
        description: prompt id that was used in the chat
        example: 588f7ee98f138b19220041a7
      actionId:
        type: string
        description: action that triggered the chat, if autonomous action
        example: 588f7ee98f138b19220041a7
      actionStepId:
        type: string
        description: action step id that triggered the chat, if autonomous action
        example: 588f7ee98f138b19220041a7
      label:
        type: string
        description: label for the chat (defaults to the first question asked)
      feedbackScore:
        type: integer
        format: int32
        description: feedback score for the chat
      shareAccess:
        type: array
        description: users who are specifically granted permission to view or edit this chat
        items:
          $ref: '#/definitions/ShareAccess'
      systemPrompts:
        type: array
        description: system prompts used (stable prefix; eligible for prompt caching across turns)
        items:
          type: string
      messages:
        type: array
        description: transcript of the messages
        items:
          $ref: '#/definitions/AiChatMessage'
      messageCount:
        type: integer
        format: int32
        description: number of messages in the chat
      totalMessageCount:
        type: integer
        format: int32
        description: number of messages in the chat, including tool usage
      summary:
        description: summary data for analysis
        $ref: '#/definitions/AiChatSummary'
      inputTokenCount:
        type: integer
        format: int32
        description: number of input tokens used
      outputTokenCount:
        type: integer
        format: int32
        description: number of output tokens used
      cacheReadInputTokenCount:
        type: integer
        format: int32
        description: number of cached input tokens read from the prompt cache
      cacheWriteInputTokenCount:
        type: integer
        format: int32
        description: number of input tokens written to the prompt cache
      creditCount:
        type: number
        description: number of AI credits consumed by this chat
      dataContextType:
        type: string
        description: data context used for this chat
        enum:
        - ASSESSMENT
