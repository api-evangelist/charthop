  WelcomeEmailSettings:
    type: object
    required:
    - isEnabled
    - welcomeEmailSubject
    - welcomeEmailButtonLabel
    - welcomeEmailBody
    properties:
      isEnabled:
        type: boolean
        description: Whether to send a welcome email
      welcomeEmailSubject:
        type: string
        description: Subject
      welcomeEmailButtonLabel:
        type: string
        description: Button label
      welcomeEmailBody:
        type: string
        description: Body
  Name:
    type: object
    required:
    - last
    properties:
      first:
        type: string
        description: first name
        example: Jane
        minItems: 0
        maxItems: 80
      middle:
        type: string
        description: middle name
        example: Quidditch
        minItems: 0
        maxItems: 80
      last:
        type: string
        description: last name
        example: Public
        minItems: 0
        maxItems: 80
      pref:
        type: string
        description: preferred first name
        example: JQ
        minItems: 0
        maxItems: 80
      prefLast:
        type: string
        description: preferred last name
        example: Smith
        minItems: 0
        maxItems: 80
  OrgDomain:
    type: object
    required:
    - domain
    - aliases
    properties:
      domain:
        type: string
      aliases:
        type: array
        uniqueItems: true
        items:
          type: string
  LayoutRow:
    type: object
    required:
    - columns
    - format
    properties:
      columns:
        type: array
        items:
          $ref: '#/definitions/LayoutColumn'
