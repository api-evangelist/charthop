      slug:
        type: string
        description: unique slug of organization
        example: acme-corp
      type:
        type: string
        description: type of organization
        example: PRIVATE
        enum:
        - PRIVATE
        - PUBLIC
        - EDU
        - GOV
        - NONPROFIT
        - DEMO
        - TEST
        - PORTFOLIO
      industry:
        type: string
        description: industry
        example: Software and Internet
