openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Search API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: Search
paths:
  /v1/org/{orgId}/search:
    get:
      tags:
      - Search
      summary: Return people, job, group, field, goal, and other entity data for a particular…
      operationId: searchOrgData
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: q
        in: query
        description: Query search term
        required: false
        schema:
          type: string
      - name: entityTypes
        in: query
        description: Entity types
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limit
        required: false
        schema:
          type: integer
          format: int32
      - name: includeFormer
        in: query
        description: Include former users or persons
        required: false
        schema:
          type: boolean
      - name: date
        in: query
        description: Date
        required: false
        schema:
          type: string
          format: date
      - name: scenarioId
        in: query
        description: Scenario Id
        required: false
        schema:
          type: string
      - name: canAccess
        in: query
        description: entity action pairs that can be accessed
        required: false
        schema:
          type: string
      - name: returnEntityBody
        in: query
        description: Include full entity body in results
        required: false
        schema:
          type: boolean
      - name: terminatedWithoutBackfill
        in: query
        description: Filter to only terminated jobs without backfill
        required: false
        schema:
          type: boolean
      - name: jobState
        in: query
        description: Filter jobs by state (OPEN or FILLED)
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: CQL filter expression applied to job results (currently only the jobs entity type honors this)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: bad request
        '404':
          description: not found
