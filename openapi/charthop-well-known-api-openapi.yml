openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Well Known API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: .well Known
paths:
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - .well Known
      summary: OAuth authorization server metadata (RFC 8414)
      operationId: authorizationServerMetadata
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /.well-known/oauth-authorization-server/mcp/{agent}:
    get:
      tags:
      - .well Known
      summary: OAuth authorization server metadata for an org-less agent MCP server (RFC 8414)
      operationId: mcpAuthorizationServerMetadataNoOrg
      parameters:
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /.well-known/oauth-authorization-server/mcp/{agent}/{orgId}:
    get:
      tags:
      - .well Known
      summary: OAuth authorization server metadata for an agent MCP server (RFC 8414)
      operationId: mcpAuthorizationServerMetadata
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /.well-known/oauth-protected-resource/mcp/{agent}:
    get:
      tags:
      - .well Known
      summary: OAuth protected resource metadata for an org-less agent MCP server (RFC 9728)
      operationId: mcpProtectedResourceMetadataNoOrg
      parameters:
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /.well-known/oauth-protected-resource/mcp/{agent}/{orgId}:
    get:
      tags:
      - .well Known
      summary: OAuth protected resource metadata for an agent MCP server (RFC 9728)
      operationId: mcpProtectedResourceMetadata
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: agent
        in: path
        description: Agent app name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /.well-known/security.txt:
    get:
      tags:
      - .well Known
      summary: security.txt (RFC 9116)
      operationId: getSecurityTxt
      responses:
        '200':
          description: successful operation
