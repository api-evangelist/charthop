swagger: '2.0'
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop access field API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
host: localhost
schemes:
- https
- http
consumes:
- application/json
produces:
- application/json
tags:
- name: field
paths:
  /v1/org/{orgId}/field:
    get:
      tags:
      - field
      summary: Return all fields in the organization paginated
      operationId: findFields
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: from
        in: query
        description: Field id to start paginating from
        required: false
        type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        type: integer
        format: int32
      - name: ids
        in: query
        description: Comma separated Field Ids to find
        required: false
        type: string
      - name: table
        in: query
        description: Retrieve fields from a particular table (id or name); if not passed, returns non-table fields
        required: false
        type: string
      - name: tableType
        in: query
        description: Retrieve fields from a particular table type; ignored if table not passed
        required: false
        type: string
      - name: form
        in: query
        description: Retrieve fields relating to a particular form
        required: false
        type: string
      - name: builtin
        in: query
        description: Include built-in (builtin), custom (custom) or all fields - defaults to custom
        required: false
        type: string
      - name: includeTtst
        in: query
        description: Include custom ttst fields - defaults to false
        required: false
        type: boolean
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsField'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - field
      summary: Create a field
      operationId: createField
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: tableType
        in: query
        description: table type to add the field to
        required: false
        type: string
      - name: body
        in: body
        description: Field data to create
        required: true
        schema:
          $ref: '#/definitions/CreateField'
      responses:
        '201':
          description: field created
          schema:
            $ref: '#/definitions/Field'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
  /v1/org/{orgId}/field/built-in:
    get:
      tags:
      - field
      summary: Get built-in fields
      operationId: getBuiltinFields
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsPartialField'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/field/category:
    get:
      tags:
      - field
      summary: Return uncategorized fields
      operationId: getUncategorizedFields
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsField'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/field/category/{categoryId}:
    get:
      tags:
      - field
      summary: Return fields in a particular category
      operationId: getFieldsInCategory
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: categoryId
        in: path
        description: Category id
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/ResultsField'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/field/delete:
    delete:
      tags:
      - field
      summary: Delete fields
      operationId: deleteFields
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        description: Field ids
        required: true
        schema:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
      responses:
        '204':
          description: fields deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/field/remove-category:
    post:
      tags:
      - field
      summary: Remove field from all associated categories
      operationId: removeFieldCategory
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        description: Fields to set as uncategorized
        required: true
        schema:
          $ref: '#/definitions/FieldRemoveCategoryRequest'
      responses:
        '204':
          description: field removed from category
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/field/remove-overrides:
    post:
      tags:
      - field
      summary: Remove overrides from fields
      operationId: removeFieldOverrides
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        description: Fields for which to remove overrides
        required: true
        schema:
          $ref: '#/definitions/FieldRemoveOverrideRequest'
      responses:
        '204':
          description: field overrides removed
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/field/status:
    post:
      tags:
      - field
      summary: Update status for existing fields
      operationId: updateFieldStatus
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: body
        in: body
        description: Field data to update
        required: true
        schema:
          $ref: '#/definitions/FieldStatusUpdateRequest'
      responses:
        '204':
          description: field status updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/field/{fieldId}:
    get:
      tags:
      - field
      summary: Return a particular field by id
      operationId: getField
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: fieldId
        in: path
        description: Field id
        required: true
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/Field'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - field
      summary: Update an existing field
      operationId: updateField
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: fieldId
        in: path
        description: Field id
        required: true
        type: string
      - name: body
        in: body
        description: Field data to update
        required: true
        schema:
          $ref: '#/definitions/UpdateField'
      responses:
        '204':
          description: field updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
    delete:
      tags:
      - field
      summary: Delete a field
      operationId: deleteField
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: fieldId
        in: path
        description: Field id
        required: true
        type: string
      responses:
        '204':
          description: field deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/field/{fieldId}/dryrun:
    patch:
      tags:
      - field
      summary: Perform a dry-run of an update to an existing field that will require migrations
      operationId: updateFieldDryRun
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        type: string
      - name: fieldId
        in: path
        description: Field id
        required: true
        type: string
      - name: body
        in: body
        description: Field data to update
        required: true
        schema:
          $ref: '#/definitions/UpdateField'
      responses:
        '204':
          description: dry run update of field
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
definitions:
  TableRef:
    type: object
    properties:
      tableId:
        type: string
        description: the table id this field references
        example: 588f7ee98f138b19220041a7
      tableName:
        type: string
        description: the table name this field references
  FieldRemoveCategoryRequest:
    type: object
    required:
    - fieldIds
    properties:
      fieldIds:
        type: array
        description: Field ids
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
  FieldRemoveOverrideRequest:
    type: object
    required:
    - fieldIds
    properties:
      fieldIds:
        type: array
        description: Field ids
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
  EnumValue:
    type: object
    required:
    - name
    - label
    properties:
      name:
        type: string
        description: enum value name
      label:
        type: string
        description: enum value label
      color:
        type: string
        description: color of property
        pattern: ^#[a-f0-9]{6}$
      expr:
        type: string
        description: computed expression, for ENUM_EXPR type
      num:
        type: number
        description: numeric value, for ENUM_SCALE type
      sort:
        type: integer
        format: int32
        description: sort order
      rank:
        type: integer
        format: int32
        description: rank order, if selected in rank order
      id:
        type: string
        description: unique identifier for enum
        example: 588f7ee98f138b19220041a7
      labelTr:
        description: translations for the label
        $ref: '#/definitions/Translations'
  Field:
    type: object
    required:
    - id
    - name
    - label
    - type
    - plural
    - isUnique
    - isRequired
    - sensitive
    properties:
      id:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id (empty if global)
        example: 588f7ee98f138b19220041a7
      name:
        type: string
        description: short field name
        example: summary
        pattern: ^[a-zA-Z][a-zA-Z0-9_]+$
        minItems: 3
        maxItems: 32
      label:
        type: string
        description: human-readable full name of field
        example: Job Summary
        minItems: 3
        maxItems: 80
      labelTr:
        description: translations for the human-readable label
        $ref: '#/definitions/Translations'
      description:
        type: string
        description: description of field
        example: This field tracks the most recent performance rating for an individual.
        minItems: 0
        maxItems: 1000
      inUse:
        type: boolean
        description: disallow any updates to this Field (except for field.question string)
      expr:
        type: string
        description: calculated expression
        example: (base + variable) / 12
        minItems: 0
        maxItems: 1000
      exprType:
        type: string
        description: the expected type of the evaluated expression
        enum:
        - ADDRESS
        - AUDIO
        - BOOLEAN
        - COMP
        - COMPOUND
        - COMP_BAND
        - CONTACTS
        - CURRENCY
        - DATE
        - DECIMAL
        - ELAPSED_DAYS
        - ELAPSED_MONTHS
        - ELAPSED_YEARS
        - EMAIL
        - ENUM
        - ENUM_EXPR
        - ENUM_MULTI
        - ENUM_SCALE
        - EXPR
        - FILE
        - GROUP
        - GROUPS
        - GROUP_ASSIGNMENTS
        - GROUP_TYPE
        - GROUP_POSITION_ASSIGNMENTS
        - IMAGE
        - INTEGER
        - JOB
        - JOB_CODE
        - JOBS
        - JOB_TIER
        - LIST
        - MAP
        - MONEY
        - NAME
        - OBJECT
        - PAY_INTERVAL
        - PERCENT
        - PERSON
        - PERSONS
        - PHONE
        - STOCKGRANT
        - STRING
        - TABLE_REF
        - TEXT
        - TIMEOFF
        - TIMESTAMP
        - TRACKED_GROUP
        - URL
        - USER
        - VARIABLE_COMP
        - VARIABLE_COMPS
      type:
        type: string
        description: type of field
        enum:
        - ADDRESS
        - AUDIO
        - BOOLEAN
        - COMP
        - COMPOUND
        - COMP_BAND
        - CONTACTS
        - CURRENCY
        - DATE
        - DECIMAL
        - ELAPSED_DAYS
        - ELAPSED_MONTHS
        - ELAPSED_YEARS
        - EMAIL
        - ENUM
        - ENUM_EXPR
        - ENUM_MULTI
        - ENUM_SCALE
        - EXPR
        - FILE
        - GROUP
        - GROUPS
        - GROUP_ASSIGNMENTS
        - GROUP_TYPE
        - GROUP_POSITION_ASSIGNMENTS
        - IMAGE
        - INTEGER
        - JOB
        - JOB_CODE
        - JOBS
        - JOB_TIER
        - LIST
        - MAP
        - MONEY
        - NAME
        - OBJECT
        - PAY_INTERVAL
        - PERCENT
        - PERSON
        - PERSONS
        - PHONE
        - STOCKGRANT
        - STRING
        - TABLE_REF
        - TEXT
        - TIMEOFF
        - TIMESTAMP
        - TRACKED_GROUP
        - URL
        - USER
        - VARIABLE_COMP
        - VARIABLE_COMPS
      plural:
        type: string
        description: plural type of the field (either SINGLE, LIST, or SET)
        enum:
        - SINGLE
        - LIST
        - SET
      values:
        type: array
        description: possible values (enum type only)
        items:
          $ref: '#/definitions/EnumValue'
      defaultValue:
        type: object
        description: default value if field is not set
      options:
        description: validation options
        $ref: '#/definitions/FieldOptions'
      entityType:
        type: string
        description: entity type of field
        enum:
        - JOB
        - JOB_OPEN
        - JOB_FILLED
        - PERSON
        - CHANGE
        - TABLE
        - ORG
        - USER
        - NONE
      isUnique:
        type: boolean
        description: indicates that this field value is unique in conjunction with entityType PERSON or JOB
      isRequired:
        type: boolean
        description: indicates that this field value is required
      isEffectiveDated:
        type: boolean
        description: indicates that this field value is effective-dated
      aliases:
        type: array
        description: set of aliases for this field
        uniqueItems: true
        items:
          type: string
      groupTypeId:
        type: string
        description: if this is a group membership field, the group type ID it's for
        example: 588f7ee98f138b19220041a7
      calc:
        type: string
        description: unique ID for the function that runs to calculate the value of this field. For native fields only
