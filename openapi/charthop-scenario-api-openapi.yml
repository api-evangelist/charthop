          type: string
          format: date
          description: effective date, if in use
        scenarioId:
          type: string
          description: id of scenario
          example: 588f7ee98f138b19220041a7
        parentEntityId:
          type: string
          description: id of associated entity, such as comp cycle
          example: 588f7ee98f138b19220041a7
        fields:
          type: array
          description: set of fields that were updated by the event
          uniqueItems: true
          items:
            type: string
        code:
          type: string
          description: event code, for example job.update
    Process:
      type: object
      required:
      - id
      - orgId
      - label
      - type
      - status
      - runUserId
      - createId
      - createAt
      - options
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent org id
          example: 588f7ee98f138b19220041a7
        label:
          type: string
          description: human-readable label that identifies this process
        type:
          type: string
          description: process type
        status:
          type: string
          description: current status of process
          enum:
          - PENDING
          - RUNNING
          - DONE
          - ERROR
        filePath:
          type: string
          description: data file path
        logPath:
          type: string
          description: data log path
        runUserId:
          type: string
          description: user id who is running the process
          example: 588f7ee98f138b19220041a7
        parentProcessId:
          type: string
          description: process id of parent process
          example: 588f7ee98f138b19220041a7
        createId:
          type: string
          description: created by user id (user who requested the process run)
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        startAt:
          type: string
          description: started at timestamp
          example: '2017-01-24T13:57:52Z'
        endAt:
          type: string
          description: ended at timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
          description: status or error message
        progress:
          type: number
          format: double
          description: percent progress so far
        internalError:
          type: string
          description: internal-only error message
        options:
          type: object
          description: options passed to the process
        results:
          type: object
          description: results summary for the process
          additionalProperties:
            type: object
        logDataList:
          type: array
          description: list of log data that occurred during running of this process
          items:
            $ref: '#/components/schemas/LogData'
        state:
          type: object
          description: process-specific state data
        summary:
          type: string
          description: human-readable, searchable summary of what this process did
        appId:
          type: string
          description: app id of the process
          example: 588f7ee98f138b19220041a7
        uuid:
          type: string
          description: unique ID of the process at queue time
          example: 84db3c6e-0877-4436-8af1-768c06b29586
    ScenarioMetadata:
      type: object
      required:
      - scenarioId
      - access
      - canChange
      - budgetImpacts
      properties:
        scenarioId:
          type: string
          description: scenario id
          example: 588f7ee98f138b19220041a7
        changeCount:
          type: integer
          format: int32
          description: number of changes contained in scenario
        jobCount:
          type: integer
          format: int32
          description: number of job changes contained in scenario
        access:
          type: array
          description: access information on the user for the entity
          items:
            $ref: '#/components/schemas/ResultsAccess'
        canChange:
          type: boolean
          description: whether user can edit the scenario
        cost:
          description: summary of cost impact on scenario
          $ref: '#/components/schemas/CostImpact'
        budgetImpacts:
          type: array
          description: summary of scenario impact on budgets
          items:
            $ref: '#/components/schemas/ScenarioBudgetImpact'
        changeAt:
          type: string
          description: most recent time the scenario was changed
          example: '2017-01-24T13:57:52Z'
        calcEndAt:
          type: string
          description: most recent summary calculation ended at timestamp
          example: '2017-01-24T13:57:52Z'
    LogData:
      type: object
      required:
      - level
      - at
      - data
      properties:
        level:
          type: string
          enum:
          - INFO
          - WARN
          - ERROR
        at:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    CreateScenario:
      type: object
      required:
      - name
      - startDateFixed
      properties:
        name:
          type: string
          description: scenario name
          example: Q4 Conservative Plan
          minItems: 1
          maxItems: 80
        description:
          type: string
          description: scenario description
          example: Q4 Conservative Plan
          minItems: 0
          maxItems: 2000
        startDate:
          type: string
          format: date
          description: date that this scenario diverges from primary
          example: '2017-01-15'
        status:
          type: string
          description: status of scenario
          enum:
          - OPEN
          - INACTIVE
          - MERGED
          - DRAFT
          - ARCHIVED
        shareAccess:
          type: array
          description: users who are specifically granted permission to this scenario
          items:
            $ref: '#/components/schemas/ShareAccess'
        type:
          type: string
          description: Type of scenario to be created
          enum:
          - GENERAL
          - COMP
          - PROMOTION
          - TERMINATE
          - CREATE_JOB
          - UPDATE_JOB
          - BUDGET
          - BACKFILL
        startDateFixed:
          type: string
          description: whether or not the start date should stay fixed in time, or update to today's date as time passes
          enum:
          - FIXED
          - TODAY
        query:
          type: string
          description: Query for selecting which people/jobs are initially included in the scenario (only applies to promotion scenarios)
        validJobIdSet:
          type: array
          description: This scenario changes are restricted to the following jobIds
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        entityId:
          type: string
          description: The entity this scenario is associated with
          example: 588f7ee98f138b19220041a7
        entityType:
          type: string
          description: The type of entity associated with this scenario
          enum:
          - COMP_REVIEW
        sharedViewConfig:
          type: array
          description: View configurations associated with this scenario
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScenarioSharedViewConfig'
        budget:
          description: Total budget associated with the scenario
          $ref: '#/components/schemas/Money'
    ShareAccess:
      type: object
      required:
      - access
      properties:
        access:
          type: string
          description: access permission level
          enum:
          - NONE
          - LIMITED_READ
          - LIMITED_WRITE
          - STANDARD_READ
          - STANDARD_WRITE
          - COMPENSATION_READ
          - FULL_READ
          - COMP_PLANNING_PARTICIPANT
          - COMPENSATION_WRITE
          - WRITE
          - COMPENSATION_OWNER
          - OWNER
        userId:
          type: string
          description: user id
          example: 5887a7718f138b6a2a0041a7
        groupId:
          type: string
          description: group id
          example: 5887a7718f138b6a2a0041a7
        fields:
          type: string
          description: fields
          example: name,image,title
    ResultsEvent:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
