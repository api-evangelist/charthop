openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Scenario API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: Scenario
paths:
  /v1/org/{orgId}/scenario:
    get:
      tags:
      - Scenario
      summary: Return all scenarios in the organization paginated
      operationId: findScenarios
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: Scenario id to start paginating from
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Scenario status to filter by
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - INACTIVE
          - MERGED
          - DRAFT
          - ARCHIVED
      - name: limit
        in: query
        description: Number of results to return
        required: false
        schema:
          type: integer
          format: int32
      - name: returnAccess
        in: query
        description: 'Return access information -- pass a list of actions to check, for example: create,update,delete'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsScenario'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
    post:
      tags:
      - Scenario
      summary: Create a scenario
      operationId: createScenario
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: silent
        in: query
        description: Suppress notification emails
        required: false
        schema:
          type: boolean
      - name: skipChangeCreation
        in: query
        description: Skip over change creation for PROMOTION scenarios
        required: false
        schema:
          type: boolean
      responses:
        '201':
          description: scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: org not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenario'
        description: Scenario data to create
        required: true
  /v1/org/{orgId}/scenario/bulk/archive:
    post:
      tags:
      - Scenario
      summary: Archive a set of scenarios
      operationId: bulkArchiveScenarios
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              uniqueItems: true
              items:
                type: string
                example: 588f7ee98f138b19220041a7
        description: List of scenario ids to archive
        required: true
  /v1/org/{orgId}/scenario/bulk/delete:
    post:
      tags:
      - Scenario
      summary: Delete a set of scenarios
      operationId: bulkDeleteScenarios
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              uniqueItems: true
              items:
                type: string
                example: 588f7ee98f138b19220041a7
        description: List of scenario ids to delete
        required: true
  /v1/org/{orgId}/scenario/bulk/unarchive:
    post:
      tags:
      - Scenario
      summary: Unarchive a set of scenarios
      operationId: bulkUnarchiveScenarios
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              uniqueItems: true
              items:
                type: string
                example: 588f7ee98f138b19220041a7
        description: List of scenario ids to unarchive
        required: true
  /v1/org/{orgId}/scenario/{scenarioId}:
    get:
      tags:
      - Scenario
      summary: Return a particular scenario by id
      operationId: getScenario
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          description: bad request
        '404':
          description: not found
    patch:
      tags:
      - Scenario
      summary: Update an existing scenario
      operationId: updateScenario
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      - name: silent
        in: query
        description: Suppress notification emails
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: scenario updated
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScenario'
        description: Scenario data to update
        required: true
    delete:
      tags:
      - Scenario
      summary: Delete a scenario
      operationId: deleteScenario
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: scenario deleted
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/scenario/{scenarioId}/audit-log:
    get:
      tags:
      - Scenario
      summary: Return past audit log events for a scenario, paginated
      operationId: getScenarioAuditLog
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return
        required: false
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: Timestamp to start search at
        required: false
        schema:
          type: string
      - name: format
        in: query
        description: Data format to use; default is json, can also use json-extended or json-readable
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsEvent'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/scenario/{scenarioId}/combine:
    post:
      tags:
      - Scenario
      summary: Combine multiple scenarios into another scenario
      operationId: combineScenarios
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id to combine the other scenarios into
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CombineScenarioRequest'
        required: true
  /v1/org/{orgId}/scenario/{scenarioId}/dates:
    post:
      tags:
      - Scenario
      summary: Adjust the dates of the changes in a scenario
      operationId: adjustDatesScenario
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustScenarioDateRequest'
        required: true
  /v1/org/{orgId}/scenario/{scenarioId}/export/audit:
    post:
      tags:
      - Scenario
      summary: Export a scenario's audit log
      operationId: exportScenarioAuditLog
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: bad request
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
        description: Export options
        required: true
  /v1/org/{orgId}/scenario/{scenarioId}/merge:
    post:
      tags:
      - Scenario
      summary: Merge a scenario into the primary timeline
      operationId: mergeScenario
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id to merge
        required: true
        schema:
          type: string
      - name: skipErrors
        in: query
        description: If passed, will skip any changes that fail validation
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
  /v1/org/{orgId}/scenario/{scenarioId}/recalculate-metadata:
    post:
      tags:
      - Scenario
      summary: Manually recalculate a scenario's metadata
      operationId: recalculateScenarioMetadata
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioMetadata'
        '400':
          description: bad request
        '401':
          description: not authorized
        '404':
          description: not found
  /v1/org/{orgId}/scenario/{scenarioId}/update-shared-view:
    post:
      tags:
      - Scenario
      summary: Update a scenario view config
      operationId: updateScenarioSharedView
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioSharedViewConfig'
        required: true
  /v1/org/{orgId}/scenario/{scenarioId}/update-shared-views:
    post:
      tags:
      - Scenario
      summary: Upsert multiple scenario view configs in a single atomic request
      operationId: updateScenarioSharedViews
      parameters:
      - name: orgId
        in: path
        description: Org identifier (either id or slug)
        required: true
        schema:
          type: string
      - name: scenarioId
        in: path
        description: Scenario id
        required: true
        schema:
          type: string
      responses:
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
        '404':
          description: not found
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ScenarioSharedViewConfig'
        description: Shared view configs to upsert, each matched and replaced by type
        required: true
components:
  schemas:
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
        currency:
          type: string
        places:
          type: integer
          format: int32
    ScenarioSharedViewConfig:
      type: object
      properties:
        customColumnNames:
          type: array
          description: list of column names to display
          items:
            type: string
        columnWidths:
          type: object
          description: map of column names to widths
          additionalProperties:
            type: integer
            format: int32
        type:
          type: string
          description: type of view
          enum:
          - ALL_CHANGES_GROUPED
          - CREATE
          - HIRE
          - DELETE
          - DEPART
          - COMP
          - UPDATE
          - MOVE
        updateId:
          type: string
          description: update id
          example: 588f7ee98f138b19220041a7
        updateAt:
          type: string
          description: update at
    AdjustScenarioDateRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          description: date to use as new start date
        days:
          type: integer
          format: int32
          description: number of days to adjust forward
    ResultsScenario:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Scenario'
        next:
          type: string
        access:
          type: array
          items:
            $ref: '#/components/schemas/ResultsAccess'
    AccessAction:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        fields:
          type: array
          uniqueItems: true
          items:
            type: string
        types:
          type: array
          uniqueItems: true
          items:
            type: string
    ResultsAccess:
      type: object
      required:
      - allowed
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        allowed:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccessAction'
    CombineScenarioRequest:
      type: object
      required:
      - scenarioIds
      properties:
        scenarioIds:
          type: array
          description: scenarios to combine
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        copyOnly:
          type: boolean
        useScenarioDateForChanges:
          type: boolean
    Scenario:
      type: object
      required:
      - id
      - orgId
      - name
      - startDate
      - status
      - shareAccess
      - createId
      - createAt
      - updateId
      - updateAt
      - startDateFixed
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent organization id
          example: 588f7ee98f138b19220041a7
        name:
          type: string
          description: scenario name
          example: Q4 Conservative Plan
          minItems: 1
          maxItems: 80
        description:
          type: string
          description: scenario description
          example: Q4 Conservative Plan
          minItems: 0
          maxItems: 2000
        startDate:
          type: string
          format: date
          description: date that this scenario diverges from primary
          example: '2017-01-15'
        status:
          type: string
          description: status of scenario
          enum:
          - OPEN
          - INACTIVE
          - MERGED
          - DRAFT
          - ARCHIVED
        shareAccess:
          type: array
          description: users who are specifically granted permission to this scenario
          items:
            $ref: '#/components/schemas/ShareAccess'
        cost:
          description: full summary of cost impact on scenario
          $ref: '#/components/schemas/CostImpact'
        changeCount:
          type: integer
          format: int32
          description: number of changes contained in scenario
        changeCounts:
          type: object
          description: number of changes of each type contained in scenario
          additionalProperties:
            type: integer
            format: int32
        createId:
          type: string
          description: created by user id
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: '2017-01-24T13:57:52Z'
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
        deleteId:
          type: string
          description: deleted by user id
          example: 588f7ee98f138b19220041a7
        deleteBehalfId:
          type: string
          description: deleted on behalf of user id
          example: 588f7ee98f138b19220041a7
        deleteAttribution:
          $ref: '#/components/schemas/Attribution'
        deleteAt:
          type: string
          description: deleted timestamp
          example: '2017-01-24T13:57:52Z'
        mergeId:
          type: string
          description: merged by user id
          example: 588f7ee98f138b19220041a7
        mergeAt:
          type: string
          description: merged timestamp
          example: '2017-01-24T13:57:52Z'
        calcStartAt:
          type: string
          description: most recent summary calculation started at timestamp
          example: '2017-01-24T13:57:52Z'
        calcEndAt:
          type: string
          description: most recent summary calculation ended at timestamp
          example: '2017-01-24T13:57:52Z'
        changeAt:
          type: string
          description: timestamp of most recent changes made to scenario
          example: '2017-01-24T13:57:52Z'
        changeId:
          type: string
          description: user who made the most recent change to scenario
          example: '2017-01-24T13:57:52Z'
        type:
          type: string
          description: Type of scenario to be created
          enum:
          - GENERAL
          - COMP
          - PROMOTION
          - TERMINATE
          - CREATE_JOB
          - UPDATE_JOB
          - BUDGET
          - BACKFILL
        startDateFixed:
          type: string
          description: whether or not the start date should stay fixed in time, or update to today's date as time passes
          enum:
          - FIXED
          - TODAY
        query:
          type: string
          description: Query for selecting which people/jobs are initially included in the scenario (only applies to promotion scenarios)
        validJobIdSet:
          type: array
          description: This scenario changes are restricted to the following jobIds
          uniqueItems: true
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        approvalRequestId:
          type: string
          description: Approval request id, if the scenario has been submitted for approval
          example: 588f7ee98f138b19220041a7
        entityId:
          type: string
          description: The entity this scenario is associated with
          example: 588f7ee98f138b19220041a7
        entityType:
          type: string
          description: The type of entity associated with this scenario
          enum:
          - COMP_REVIEW
        sharedViewConfig:
          type: array
          description: View configurations associated with this scenario
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScenarioSharedViewConfig'
        budget:
          description: Total budget associated with the scenario
          $ref: '#/components/schemas/Money'
    Event:
      type: object
      required:
      - id
      - userId
      - type
      - entityType
      - entityId
      - at
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        userId:
          type: string
          description: user id who caused the event
          example: 588f7ee98f138b19220041a7
        orgId:
          type: string
          description: parent organization id
          example: 588f7ee98f138b19220041a7
        type:
          type: string
          description: type of event
          enum:
          - APP
          - APPROVE
          - CANCEL
          - COMBINE
          - CREATE
          - DELETE
          - DONE
          - ERROR
          - EXPORT
          - EXPORT_CSV
          - EXPORT_ORG_CHART
          - GENERATE
          - GEOIP
          - INCOMING
          - INSTALL
          - INVITE
          - INBOUND
          - LOGIN
          - MERGE
          - MESSAGE
          - OUTBOUND
          - PREVIEW_AS
          - READ
          - READ_EXTERNAL
          - READ_SENSITIVE
          - READ_ATS
          - READ_ATS_WEBHOOK
          - READ_FULL_NAME
          - READ_FUTURE_DATE
          - READ_METADATA
          - READ_COMP
          - READ_BILLING
          - READ_PENDING
          - READ_PAYROLL
          - READ_SENSITIVE_FILTERS
          - WRITE_EXTERNAL
          - REASSIGN
          - REJECT
          - RELEASE
          - REMIND
          - REMOVE_PASSWORD
          - REQUEST
          - RESTORE
          - RESUME
          - REVOKE
          - RUN
          - RUN_ATS
          - SECURITY
          - SHARE
          - SHOW_DASHBOARD_DAYS_AHEAD
          - SHOW_OPEN_JOBS
          - STEP
          - SUBMIT
          - SYNC
          - TEST
          - TOKEN
          - UNINSTALL
          - UPDATE
          - UPDATE_PASSWORD
          - UPLOAD_CSV
          - WRITE
          - VIEW_AS
        entityType:
          type: string
          description: type of target entity
          enum:
          - ACTION
          - AGREEMENT
          - AI_AGENT
          - AI_AGENT_MEMORY
          - AI_CHAT
          - AI_CONFIG
          - AI_CREDIT_LIMIT
          - AI_CREDIT_USAGE
          - AI_HINT
          - AI_PROMPT
          - APP
          - APP_CONFIG
          - APPROVAL_CHAIN
          - APPROVAL_CHAIN_STAGE
          - APPROVAL_DELEGATE
          - APPROVAL_REQUEST
          - ASSESSMENT
          - BUDGET
          - BUDGET_POOL
          - BUNDLE
