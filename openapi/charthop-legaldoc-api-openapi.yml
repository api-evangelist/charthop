openapi: 3.2.0
info:
  description: REST API for ChartHop
  version: V1.0.0
  title: ChartHop Legal Doc API
  contact:
    name: ChartHop
    url: https://www.charthop.com
    email: support@charthop.com
servers:
- url: https://localhost
- url: http://localhost
tags:
- name: legalDoc
paths:
  /v1/legaldoc:
    post:
      tags:
      - legalDoc
      summary: Create a legal doc
      operationId: createLegalDoc
      responses:
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalDoc'
        required: true
  /v1/legaldoc/{name}:
    get:
      tags:
      - legalDoc
      summary: Retrieve the legal doc by name
      operationId: getLegalDoc
      parameters:
      - name: name
        in: path
        description: name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDoc'
        '400':
          description: invalid data
        '401':
          description: not authorized
        '403':
          description: permission denied
components:
  schemas:
    LegalDoc:
      type: object
      required:
      - id
      - name
      - date
      properties:
        id:
          type: string
          description: globally unique id
          example: 588f7ee98f138b19220041a7
        name:
          type: string
          description: human-readable full name of form
          example: ChartHop Service Agreement
        content:
          type: string
          description: legal doc content
        date:
          type: string
          format: date
          description: content by date
        createId:
          type: string
          description: created by user id
          example: 588f7ee98f138b19220041a7
        createBehalfId:
          type: string
          description: created on behalf of user id
          example: 588f7ee98f138b19220041a7
        createAttribution:
          $ref: '#/components/schemas/Attribution'
        createAt:
          type: string
          description: created timestamp
          example: 2017-01-24T13:52Z
        updateId:
          type: string
          description: last updated by user id
          example: 588f7ee98f138b19220041a7
        updateBehalfId:
          type: string
          description: last updated on behalf of user id
          example: 588f7ee98f138b19220041a7
        updateAttribution:
          $ref: '#/components/schemas/Attribution'
        updateAt:
          type: string
          description: last updated timestamp
          example: '2017-01-24T13:57:52Z'
    CreateLegalDoc:
      type: object
      required:
      - name
      - content
      - date
      properties:
        name:
          type: string
          description: human-readable full name of form
          example: ChartHop Service Agreement
        content:
          type: string
          description: legal doc content
        date:
          type: string
          format: date
          description: content by date
    Attribution:
      type: object
      properties:
        principalUserId:
          type: string
          example: 588f7ee98f138b19220041a7
        agentUserIds:
          type: array
          items:
            type: string
            example: 588f7ee98f138b19220041a7
        eventId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiChatId:
          type: string
          example: 588f7ee98f138b19220041a7
        aiToolUseId:
          type: string
        channel:
          type: string
          enum:
          - WEB
          - MOBILE
          - SLACK
          - TEAMS
          - MCP
