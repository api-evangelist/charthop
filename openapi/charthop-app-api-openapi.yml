        type: array
        description: OAuth client identities allowed to connect as this agent over MCP. Each entry is either a full Client ID Metadata Document (CIMD) URL (matched exactly, e.g. Claude Code's fixed URL) or a bare host (matched against the client_id's host, e.g. chatgpt.com, for clients whose CIMD URL varies per server).
        example: '["https://claude.ai/oauth/claude-code-client-metadata", "chatgpt.com"]'
        items:
          type: string
      mcpInstructions:
        type: string
        description: Connection instructions shown on the agent's MCP tab (e.g. how to add this MCP server to a client like Claude Code). The literal token {{mcpUrl}} is replaced with the org-specific MCP server URL when displayed.
        example: 'Run: claude mcp add --transport http charthop {{mcpUrl}}

          Then run /mcp and sign in.'
