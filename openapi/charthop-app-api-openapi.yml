        pattern: ^[a-zA-Z0-9._/-]+$
      status:
        type: string
        description: current status of user
        enum:
        - SUPERUSER
        - NORMAL
        - INACTIVE
        - UNINSTALLED
      options:
        type: object
        description: for apps, options (specific options are specific to the particular app); for users, user-set preferences
      internalOptions:
        type: object
        description: internal (ChartHop controlled) options
      secrets:
        type: object
        description: write-only secrets; the content of these secrets are not retrievable via the external-facing API
      emailSettings:
        type: array
        description: Email settings for the user
        items:
          $ref: '#/definitions/UserEmailSetting'
      sensitive:
        type: string
        description: sensitivity level of the user's configuration; only applicable to APP users
        enum:
        - GLOBAL
        - ORG
        - SENSITIVE
        - PERSONAL
        - MANAGER
        - HIGH
        - PRIVATE
      shareAccess:
        type: array
        description: users and groups who have access to configure this user; only applicable to APP users
        items:
          $ref: '#/definitions/ShareAccess'
      agentConfig:
        description: per-user agent configuration overrides
        $ref: '#/definitions/AiAgentConfig'
  DueDate:
    type: object
    required:
    - type
    - dueDay
    - dueTime
    properties:
      type:
        type: string
        enum:
        - EXACT
        - RELATIVE
      dueDay:
        type: string
        description: due day, in either relative (-7d) or exact (YYYY-MM-DD) format
      dueTime:
        type: string
        description: due time, which is a LocalTime
  Money:
    type: object
    required:
    - amount
    - currency
    properties:
      amount:
        type: number
      currency:
        type: string
      places:
        type: integer
        format: int32
  ApiOperationCall:
    type: object
    required:
    - operation
    properties:
      operation:
        type: string
      params:
        type: object
        additionalProperties:
          type: string
      forEach:
        $ref: '#/definitions/ForEach'
  SignaturePlacement:
    type: object
    required:
    - type
    - x
    - y
    - pageNumber
    properties:
      type:
        type: string
        description: the kind of placement
        enum:
        - SIGNATURE
        - NAME
        - TITLE
        - DATE
        - EXPR
      x:
        type: number
        format: float
        description: horizontal position as a fraction (0..1) of page width, from the left edge
      y:
        type: number
        format: float
        description: vertical position as a fraction (0..1) of page height, from the top edge
      pageNumber:
        type: integer
        format: int32
        description: 1-based page number the placement is anchored to
      width:
        type: number
        format: float
        description: optional width as a fraction (0..1) of page width, reserved for future use
      height:
        type: number
        format: float
        description: optional height as a fraction (0..1) of page height, reserved for future use
      expr:
        type: string
        description: carrot expression evaluated against the document's person; required for EXPR placements
      signerNumber:
        type: integer
        format: int32
        description: 1-based signer this placement binds to; when null, the placement is assigned to a signer by position
  AccessTokenResponse:
    type: object
    required:
    - access_token
    - expires_in
    properties:
      access_token:
        type: string
        description: access token value
        readOnly: true
        example: 2YotnFZFEjr1zCsicMWsdv
      token_type:
        type: string
        description: access token type
        readOnly: true
        example: bearer
      expires_in:
        type: integer
        format: int32
        description: expiration time of token, in seconds
        readOnly: true
        example: '86400'
      refresh_token:
        type: string
        description: refresh token value
        readOnly: true
        example: tGzv3JOkF0XG5Qx2TlKWIA
      scope:
        type: string
        description: scope of the access token
        readOnly: true
        example: admin
      redirect_uri:
        type: string
        description: redirect uri of the access token
        readOnly: true
        example: com.charthop.mobile://oauth
  CreateApp:
    type: object
    required:
    - orgId
    - name
    - title
    - summary
    - cronOrder
    - minAccess
    - type
    properties:
      orgId:
        type: string
        description: organization id
        example: 588f7ee98f138b19220041a7
      name:
        type: string
        description: short unique name
        example: slack-import
        pattern: ^[a-z0-9-]+$
        minItems: 3
        maxItems: 30
      redirectUris:
        type: array
        description: list of acceptable Oauth2 redirect URIs, if Oauth2 is supported for this app
        items:
          type: string
          format: uri
      oauthClientIds:
        type: array
        description: OAuth client identities allowed to connect as this agent over MCP. Each entry is either a full Client ID Metadata Document (CIMD) URL (matched exactly, e.g. Claude Code's fixed URL) or a bare host (matched against the client_id's host, e.g. chatgpt.com, for clients whose CIMD URL varies per server).
        example: '["https://claude.ai/oauth/claude-code-client-metadata", "chatgpt.com"]'
        items:
          type: string
      mcpInstructions:
        type: string
        description: Connection instructions shown on the agent's MCP tab (e.g. how to add this MCP server to a client like Claude Code). The literal token {{mcpUrl}} is replaced with the org-specific MCP server URL when displayed.
        example: 'Run: claude mcp add --transport http charthop {{mcpUrl}}

          Then run /mcp and sign in.'
      allowedIps:
        type: array
        description: allowlist of IPs or IP ranges that are allowed to make API calls on behalf of this app
        items:
          type: string
      configFields:
        type: array
        description: list of configuration fields
        items:
          $ref: '#/definitions/AppConfigField'
      title:
        type: string
        description: human-readable name of app
        example: Slack
        minItems: 4
        maxItems: 50
      summary:
        type: string
        description: short summary of app
        example: The Slack app does X Y and Z
        minItems: 5
        maxItems: 140
      description:
        type: string
        description: full description of app, in Markdown
        example: The Slack app does X Y and Z
      setupInstructions:
        type: string
        description: setup instructions, in Markdown
        example: To install the Slack, use your API key from X and Y
      cronOrder:
        type: integer
        format: int32
        description: execution order of the cron (lower numbers execute earlier)
      cronSchedule:
        type: string
        description: cron schedule
        enum:
        - DAILY
        - WEEKLY
      cronDayOfWeek:
        type: string
        description: Day of week if cronSchedule is WEEKLY
        enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      imagePath:
        type: string
        description: path to avatar profile image, should be approximately square dimensions and show logo
        pattern: ^[a-zA-Z0-9._/-]+$
      wordmarkImagePath:
        type: string
        description: path to larger profile logo image containing brand wordmark, does not need to be square dimensions
        pattern: ^[a-zA-Z0-9._/-]+$
      poweredByImagePath:
        type: string
        description: path to powered by image, should be approximately square dimensions and show logo
        pattern: ^[a-zA-Z0-9._/-]+$
      status:
        type: string
        description: current status of app
        enum:
        - GLOBAL
        - ACTIVE
        - INACTIVE
        - DEVELOPMENT
      minAccess:
        type: string
        description: minimum access level requested by app
        enum:
        - NONE
        - PREBOARDING
        - VIEW
        - LIMITED
        - MEMBER_LIMITED_COMP
        - MEMBER
        - CUSTOM
        - TECH_OWNER
        - TIMEOFF
        - CONTACT
        - COMP_CASH
        - COMP_EQUITY
        - COMP_ALL
        - RECRUIT_SENSITIVE
        - RECRUIT_PRIMARY
        - SENSITIVE_LIMITED_COMP
        - SENSITIVE
        - PRIMARY
        - PEOPLE_OPS_ADMIN
        - PEOPLE_OPS_ADMIN_NO_COMP_DATA
        - PEOPLE_OPS_ADMIN_NO_SENSITIVE_DATA
        - OWNER
      roleId:
        type: string
        description: roleId requested by app
        example: 588f7ee98f138b19220041a7
      eventNotifyUrl:
        type: string
        format: uri
        description: URL that should be notified on events
      payload:
        type: object
        description: custom payload to send in lieu of regular payload
        additionalProperties:
          type: string
      events:
        type: array
        description: set of events to notify on
        uniqueItems: true
        items:
          type: string
      type:
        type: string
        description: APP, BUNDLE, or INTERNAL
        enum:
        - AGENT
        - APP
        - BUNDLE
        - INTERNAL
      bundle:
        description: for apps of type BUNDLE, the contents included in the bundle
        $ref: '#/definitions/Bundle'
      agentConfig:
        description: for apps of type AGENT, the configuration of the agent
        $ref: '#/definitions/AiAgentConfig'
      externalApiConfig:
        description: for apps with external API capabilities, the API configuration
        $ref: '#/definitions/ExternalApiConfig'
      webhookConfig:
        description: for apps that receive inbound webhooks, the webhook configuration
        $ref: '#/definitions/WebhookConfig'
      secrets:
        description: write-only app-level secrets
        $ref: '#/definitions/AppSecrets'
      scopes:
        type: array
        description: access scopes that the app is requesting
        items:
          type: string
      tags:
        type: array
        description: tags/categories the app belongs to
        items:
          type: string
      requiredFeatures:
        type: array
        description: The product features that are required in order to install the app or bundle
        items:
          type: string
          enum:
          - AI_ACTION
          - AI_AGENT
          - AI_API_WRITE
          - AI_SLACK_TEAM_CHAT
          - ATS_SYNC
          - BUDGET
          - COMPENSATION_REVIEW
          - CUSTOM_CALENDAR
          - CUSTOM_FIELD
          - CUSTOM_FIELD_READONLY
          - CUSTOM_FORM
          - CUSTOM_PROFILE_TAB
          - CUSTOM_ROLE
          - FORM_ANONYMOUS
          - FORM_RELEASE
          - FORM_SIGNATURE
          - GOAL
          - MULTI_PAYROLL
          - PERFORMANCE_REVIEW
          - REPORT
          - REPORT_READONLY
          - SCENARIO
          - SIGNATURE
          - SIGNATURE_QES
          - SIMPLE_WORKFLOWS
          - SURVEY
          - TABLE
          - TEMPLATE
          - WORKDAY_ADAPTIVE
          - PAYROLL_OUTBOUND
          - APPROVAL_WORKFLOWS
          - CONTENT
          - IDENTITY_OUTBOUND
          - ONBOARDING_OFFBOARDING
          - TIMEOFF
      internalOptions:
        type: object
        description: internal (ChartHop controlled) options
  WebhookConfig:
    type: object
    required:
    - auth
    properties:
      auth:
        type: string
        description: verification mechanism applied to inbound webhook requests
        enum:
        - HMAC
        - JWT
        - HEADER_SECRET
        - HEADER_BEARER
        - HEADER_BASIC
      hmac:
        description: tuning parameters when auth=HMAC; ignored otherwise
        $ref: '#/definitions/HmacConfig'
      jwt:
        description: tuning parameters when auth=JWT; ignored otherwise
        $ref: '#/definitions/JwtConfig'
      signatureHeader:
        type: string
        description: 'header name carrying the signature/JWT/secret. Defaults: HMAC=X-Signature, JWT/HEADER_BEARER/HEADER_BASIC=Authorization, HEADER_SECRET=X-Webhook-Secret'
      timestampHeader:
        type: string
        description: for HMAC schemes that include a timestamp in the signing input, name of the header carrying the request timestamp. Default=X-Timestamp
      signaturePrefix:
        type: string
        description: optional prefix stripped from the signature header before comparison (e.g. "sha256=" for github-style HMAC signatures, or "Bearer " for JWT)
  PartialAction:
    type: object
    properties:
      id:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id
        example: 588f7ee98f138b19220041a7
      event:
        type: string
        description: event pattern to match on, such as change.create.*
      cronSchedule:
        type: string
        description: cron schedule to run on, in crontab format
        example: 5 4 * * *
      filter:
        type: string
        description: only run when matching a particular filter
      steps:
        type: array
