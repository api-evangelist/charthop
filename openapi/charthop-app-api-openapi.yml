  UpdateApp:
    type: object
    properties:
      name:
        type: string
        description: short unique name
        example: slack-import
        pattern: ^[a-z0-9-]+$
        minItems: 3
        maxItems: 30
      redirectUris:
        type: array
        description: list of acceptable Oauth2 redirect URIs, if Oauth2 is supported for this app
        items:
          type: string
          format: uri
      oauthClientIds:
        type: array
        description: OAuth client identities allowed to connect as this agent over MCP. Each entry is either a full Client ID Metadata Document (CIMD) URL (matched exactly, e.g. Claude Code's fixed URL) or a bare host (matched against the client_id's host, e.g. chatgpt.com, for clients whose CIMD URL varies per server).
        example: '["https://claude.ai/oauth/claude-code-client-metadata", "chatgpt.com"]'
        items:
          type: string
      mcpInstructions:
        type: string
        description: Connection instructions shown on the agent's MCP tab (e.g. how to add this MCP server to a client like Claude Code). The literal token {{mcpUrl}} is replaced with the org-specific MCP server URL when displayed.
        example: 'Run: claude mcp add --transport http charthop {{mcpUrl}}

          Then run /mcp and sign in.'
      allowedIps:
        type: array
        description: allowlist of IPs or IP ranges that are allowed to make API calls on behalf of this app
        items:
          type: string
      configFields:
        type: array
        description: list of configuration fields
        items:
          $ref: '#/definitions/AppConfigField'
      title:
        type: string
        description: human-readable name of app
        example: Slack
        minItems: 4
        maxItems: 50
      summary:
        type: string
        description: short summary of app
        example: The Slack app does X Y and Z
        minItems: 5
        maxItems: 140
      description:
        type: string
        description: full description of app, in Markdown
        example: The Slack app does X Y and Z
      setupInstructions:
        type: string
        description: setup instructions, in Markdown
        example: To install the Slack, use your API key from X and Y
      cronOrder:
        type: integer
        format: int32
        description: execution order of the cron (lower numbers execute earlier)
      cronSchedule:
        type: string
        description: cron schedule
        enum:
        - DAILY
        - WEEKLY
      cronDayOfWeek:
        type: string
        description: Day of week if cronSchedule is WEEKLY
        enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      imagePath:
        type: string
        description: path to avatar profile image, should be approximately square dimensions and show logo
        pattern: ^[a-zA-Z0-9._/-]+$
      wordmarkImagePath:
        type: string
        description: path to larger profile logo image containing brand wordmark, does not need to be square dimensions
        pattern: ^[a-zA-Z0-9._/-]+$
      poweredByImagePath:
        type: string
        description: path to powered by image, should be approximately square dimensions and show logo
        pattern: ^[a-zA-Z0-9._/-]+$
      status:
        type: string
        description: current status of app
        enum:
        - GLOBAL
        - ACTIVE
        - INACTIVE
        - DEVELOPMENT
      minAccess:
        type: string
        description: minimum access level requested by app
        enum:
        - NONE
        - PREBOARDING
        - VIEW
        - LIMITED
        - MEMBER_LIMITED_COMP
        - MEMBER
        - CUSTOM
        - TECH_OWNER
        - TIMEOFF
        - CONTACT
        - COMP_CASH
        - COMP_EQUITY
        - COMP_ALL
        - RECRUIT_SENSITIVE
        - RECRUIT_PRIMARY
        - SENSITIVE_LIMITED_COMP
        - SENSITIVE
        - PRIMARY
        - PEOPLE_OPS_ADMIN
        - PEOPLE_OPS_ADMIN_NO_COMP_DATA
        - PEOPLE_OPS_ADMIN_NO_SENSITIVE_DATA
        - OWNER
      roleId:
        type: string
        description: roleId requested by app
        example: 588f7ee98f138b19220041a7
      eventNotifyUrl:
        type: string
        format: uri
        description: URL that should be notified on events
      payload:
        type: object
        description: custom payload to send in lieu of regular payload
        additionalProperties:
          type: string
      events:
        type: array
        description: set of events to notify on
        uniqueItems: true
        items:
          type: string
      type:
        type: string
        description: APP, BUNDLE, or INTERNAL
        enum:
        - AGENT
        - APP
        - BUNDLE
        - INTERNAL
      bundle:
        description: for apps of type BUNDLE, the contents included in the bundle
        $ref: '#/definitions/Bundle'
      agentConfig:
        description: for apps of type AGENT, the configuration of the agent
        $ref: '#/definitions/AiAgentConfig'
      externalApiConfig:
        description: for apps with external API capabilities, the API configuration
        $ref: '#/definitions/ExternalApiConfig'
      webhookConfig:
        description: for apps that receive inbound webhooks, the webhook configuration
        $ref: '#/definitions/WebhookConfig'
      secrets:
        description: write-only app-level secrets
        $ref: '#/definitions/AppSecrets'
      scopes:
        type: array
        description: access scopes that the app is requesting
        items:
          type: string
      tags:
        type: array
        description: tags/categories the app belongs to
        items:
          type: string
      requiredFeatures:
        type: array
        description: The product features that are required in order to install the app or bundle
        items:
          type: string
          enum:
          - AI_ACTION
          - AI_AGENT
          - AI_API_WRITE
          - AI_SLACK_TEAM_CHAT
          - ATS_SYNC
          - BUDGET
          - COMPENSATION_REVIEW
          - CUSTOM_CALENDAR
          - CUSTOM_FIELD
          - CUSTOM_FIELD_READONLY
          - CUSTOM_FORM
          - CUSTOM_PROFILE_TAB
          - CUSTOM_ROLE
          - FORM_ANONYMOUS
          - FORM_RELEASE
          - FORM_SIGNATURE
          - GOAL
          - MULTI_PAYROLL
          - PERFORMANCE_REVIEW
          - REPORT
          - REPORT_READONLY
          - SCENARIO
          - SIGNATURE
          - SIGNATURE_QES
          - SIMPLE_WORKFLOWS
          - SURVEY
          - TABLE
          - TEMPLATE
          - WORKDAY_ADAPTIVE
          - PAYROLL_OUTBOUND
          - APPROVAL_WORKFLOWS
          - CONTENT
          - IDENTITY_OUTBOUND
          - ONBOARDING_OFFBOARDING
          - TIMEOFF
      internalOptions:
        type: object
        description: internal (ChartHop controlled) options
