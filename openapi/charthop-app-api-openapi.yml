  OutboundFieldMapper:
    type: object
    required:
    - charthopExpr
    properties:
      key:
        type: string
        description: 'stable semantic name for this value: the op-call references it as {{key}}, the diff joins it to the inbound read of the same key, and per-install AppConfig overrides/disables key off it. Defaults to charthopExpr (so it must be set when charthopExpr is a formula).'
      charthopExpr:
        type: string
        description: CQL expression evaluated against the ChartHop entity, producing the value to write
      writeAs:
        type: string
        description: remote write path for a value routed through a generic collector (e.g. "custom_fields.employment_type"); omitted for fields the op-call params name directly. Dotted paths nest into the request body.
      transform:
        type: string
        description: optional named transform applied to the value before it is bound
      transformArgs:
        type: object
        description: optional static configuration passed to the transform (e.g. codelist domain/name)
        additionalProperties:
          type: string
      gate:
        type: string
        description: optional CQL boolean; when it resolves to false the mapper is skipped
      refEntity:
        type: string
        description: optional entities-catalog type (e.g. "department", "office", "user") to match the value against -> remote id(s); absent passes the value through. Cardinality follows the body property's type.
