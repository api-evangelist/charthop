  PartialForm:
    type: object
    properties:
      id:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id
        example: 588f7ee98f138b19220041a7
      label:
        type: string
        description: human-readable full name of form
        example: 'Health Index: Q2'
        minItems: 1
        maxItems: 255
      displayName:
        type: string
        description: display name of form during completion
        example: Health Index
        minItems: 1
        maxItems: 255
      displayNameTr:
        description: display name of form, translated
        $ref: '#/definitions/Translations'
      description:
        type: string
        description: description of form
        example: The Engineering department, where engineers develop new technology and products.
        minItems: 0
        maxItems: 1000
      blocks:
        type: array
        description: ordered list of blocks being collected in this form
        items:
          $ref: '#/definitions/FormBlock'
      status:
        type: string
        description: status of the form
        enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED
      type:
        type: string
        description: type of the form
        enum:
        - BUILT_IN
        - CUSTOM
      targetType:
        type: string
        description: target type that the form can be filled out about
        enum:
        - NONE
        - PERSON
      targetFilter:
        type: string
        description: filter that controls on which profiles this tab will appear
      submitFilter:
        type: string
        description: filter that controls which respondents can submit this form. The form:submit permission, if present, overrides this filter
      responseReadFilter:
        type: string
        description: filter that controls who can read the form responses. The formResponse:read permission, if present, overrides this filter
      approval:
        type: string
        description: approval needed, if any approval is required
        enum:
        - MANAGER
        - GRAND_MANAGER
      release:
        type: string
        description: whether a release step is involved (subsequent to approval if any)
        enum:
        - SUBMITTER
        - ADMIN
      releaseMessageChannel:
        description: the message channel to be used for release notifications
        $ref: '#/definitions/MessageChannelConfig'
      share:
        type: string
        description: whether sharing form responses is allowed
        enum:
        - SUBMITTER
        - ADMIN
      shareMessageChannel:
        description: the message channel to be used for sharing notifications
        $ref: '#/definitions/MessageChannelConfig'
      autoShare:
        type: array
        description: list of automatic sharing to be done after submission
        items:
          $ref: '#/definitions/AutoShare'
      autoShareMessageChannel:
        description: the message channel to be used for automatic sharing notifications
        $ref: '#/definitions/MessageChannelConfig'
      submitterEdit:
        description: post-submission editing permissions for the submitter
        $ref: '#/definitions/FormEditAccess'
      approverEdit:
        description: post-submission editing permissions for the approver
        $ref: '#/definitions/FormEditAccess'
      signature:
        description: if the form response should generate a PDF which should be sent for signature, these settings are used
        $ref: '#/definitions/FormSignatureConfig'
      authorSensitive:
        type: string
        description: view sensitivity for the author of this form - the level of view access required to view the createId and updateId fields. If null, the author's identity is always visible as long as the viewer can read the form response. If set to PRIVATE, the author's identity is stored in ChartHop, but protected such that even users with sensitive access cannot access the data. If set to ANONYMOUS, the author's identity is not stored in ChartHop at all.
        enum:
        - ANONYMOUS
        - PRIVATE
        - HIGH
        - MANAGER
      options:
        description: options, such as notification settings
        $ref: '#/definitions/FormOptions'
      completeMode:
        type: string
        description: appearance of the form during completion
        enum:
        - MODAL
        - FULLSCREEN
      ai:
        description: AI form completion and assistance settings
        $ref: '#/definitions/FormAiConfig'
      createId:
        type: string
        description: created by user id
        example: 588f7ee98f138b19220041a7
      createBehalfId:
        type: string
        description: created on behalf of user id
        example: 588f7ee98f138b19220041a7
      createAttribution:
        $ref: '#/definitions/Attribution'
      createAt:
        type: string
        description: created timestamp
        example: 2017-01-24T13:52Z
      updateId:
        type: string
        description: last updated by user id
        example: 588f7ee98f138b19220041a7
      updateBehalfId:
        type: string
        description: last updated on behalf of user id
        example: 588f7ee98f138b19220041a7
      updateAttribution:
        $ref: '#/definitions/Attribution'
      updateAt:
        type: string
        description: last updated timestamp
        example: '2017-01-24T13:57:52Z'
      deleteId:
        type: string
        description: deleted by user id
        example: 588f7ee98f138b19220041a7
      deleteBehalfId:
        type: string
        description: deleted on behalf of user id
        example: 588f7ee98f138b19220041a7
      deleteAttribution:
        $ref: '#/definitions/Attribution'
      deleteAt:
        type: string
        description: deleted timestamp
        example: '2017-01-24T13:57:52Z'
