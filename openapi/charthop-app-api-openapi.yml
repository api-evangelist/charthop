      pull:
        $ref: '#/definitions/PullAppConfig'
      ats:
        $ref: '#/definitions/AtsAppConfig'
      transcript:
        $ref: '#/definitions/TranscriptAppConfig'
      inboundFieldMappers:
        type: array
        items:
          $ref: '#/definitions/FieldMapper'
      outboundFieldMappers:
        type: array
        items:
          $ref: '#/definitions/OutboundFieldMapper'
      rateLimit:
