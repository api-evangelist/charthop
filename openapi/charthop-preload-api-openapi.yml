        description: Enables form rejections instead of request changes, for backwards compatiblity
      enableCalibration:
        type: boolean
        description: Enables the calibration feature for performance reviews
      useStandardizedTitle:
        type: string
        description: Whether to suggest or enforce standardized titles
      enableProfilePageV2:
        type: boolean
        description: Enables the redesigned profile page
      enableHomeCustomLayout:
        type: boolean
        description: Enables using a custom layout for the home page
      homeCustomLayout:
        description: The custom layout for the home page
        $ref: '#/definitions/Layout'
      enableSkipSignatureConfirmationEmail:
        type: boolean
        description: Temporary option to turn on skipping emails for signatures, until we have a better solution for miller-cooper
      disableSignatureTitles:
        type: boolean
        description: When set to true, do not include job titles in signatures
      enableHiddenRolesAndPolicies:
        type: boolean
      enableAlphaApps:
        type: boolean
        description: Allows this org to access applications in alpha
      csvImportMaxNumRows:
        type: integer
        format: int32
        description: The maximum number of rows for CSV imports
      enableGoals:
        type: boolean
        description: Enable goal-setting features in the org
      disableAiMemory:
        type: boolean
        description: Disable AI agent persistent memory in the org
      enableLegacyBands:
        type: boolean
        description: Enable bands V1 feature in the org
      enableApprovalDelegates:
        type: boolean
        description: Enable Approval Delegates feature in the org
      useImporterV3:
        type: boolean
        description: Whether to use the v3 job importer
      logImportErrorsUsingJavaLogger:
        type: boolean
        description: Whether the v3 job importer should log errors to the java logger in addition to the log file
      enableIdentitySyncLogging:
        type: boolean
        description: Emit verbose identity sync deactivation diagnostics to the process log
      scenarioCostExpr:
        type: string
        description: Cost calculation used for scenarios by default, if not set defaults to annualized cost with multiplier
      scenarioCostLabel:
        type: string
        description: Label to show for cost in scenarios, if not set defaults to 'Annual Cost'
      scenarioCostDescription:
        type: string
        description: Description to show for cost in scenarios,
      disableAiKnowledgeBase:
        type: boolean
        description: Global option to disable AI knowledge base usage (typically for AWS outages)
      qesFilter:
        type: string
        description: filter expression evaluated on each signer for whether to use qualified electronic signature (if it evaluates to true for any signer, QES will be used)
      disableQes:
        type: boolean
        description: disable QES usage while still using external vendor, purely for testing
      enableBudgets:
        type: boolean
        description: enable budgets feature
      enableEndOfYearTimeOffBalanceDisplay:
        type: boolean
        description: display end-of-year balance (roughly) on the time off profile page even for accrued policies
      timeOffCustomBalanceDescription:
        type: string
        description: custom time off balance description (if blank, shows default message)
      csvImportSetAdjustCreateDate:
        type: boolean
        description: Set the adjustCreateDate import option needed for turbo
      csvImportCreateJobsWithMissingManager:
        type: boolean
        description: Set the createJobsWithMissingManager import option
      csvImportReassignDirectReportsOnMove:
        type: boolean
        description: Set the reassignDirectReportsOnMove import option (reassign a moved manager's reports to the target job)
      defaultBackfillJobSensitivity:
        type: string
        description: Default sensitivity for backfill jobs (defaults to HIGH if not set)
        enum:
        - GLOBAL
        - ORG
        - SENSITIVE
        - PERSONAL
        - MANAGER
        - HIGH
        - PRIVATE
      jobCodeMatchMaxCatalogSize:
        type: integer
        format: int32
        description: 'Maximum number of job codes allowed for AI job-code matching (default: 1000)'
  UserEmailSetting:
    type: object
    required:
    - category
    - subscribed
    properties:
      category:
        type: string
        description: Category of emails
        example: ADMINISTRATIVE
        enum:
        - ADMINISTRATIVE
        - BILLING
        - DATA_IMPORT_AND_SYNC_STATUS
        - TRIAL_REMINDERS
        - APPROVAL_NOTIFICATIONS
      subscribed:
        type: boolean
        description: Is user subscribed to the category of emails
  AutoIncFieldPart:
    type: object
    required:
    - type
    - value
    properties:
      type:
        type: string
        enum:
        - LITERAL_STRING
        - GROUP_CODE
      value:
        type: object
      defaultValue:
        type: string
  Category:
    type: object
    required:
    - id
    - label
    properties:
      id:
        type: string
        description: globally unique id
        example: 588f7ee98f138b19220041a7
      orgId:
        type: string
        description: parent organization id (empty if built-in)
        example: 588f7ee98f138b19220041a7
      label:
        type: string
        description: human-readable label of category
        example: Performance
        minItems: 3
        maxItems: 80
      fieldIds:
        type: array
        description: set of field ids included in this category
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      nativeFields:
        type: array
        description: set of native field names included in this category
        uniqueItems: true
        items:
          type: string
      createId:
        type: string
        description: created by user id
        example: 588f7ee98f138b19220041a7
      createBehalfId:
        type: string
        description: created on behalf of user id
        example: 588f7ee98f138b19220041a7
      createAttribution:
        $ref: '#/definitions/Attribution'
      createAt:
        type: string
        description: created timestamp
        example: '2017-01-24T13:57:52Z'
      updateId:
        type: string
        description: last updated by user id
        example: 588f7ee98f138b19220041a7
      updateBehalfId:
        type: string
        description: last updated on behalf of user id
        example: 588f7ee98f138b19220041a7
      updateAttribution:
        $ref: '#/definitions/Attribution'
      updateAt:
        type: string
        description: last updated timestamp
        example: '2017-01-24T13:57:52Z'
      deleteId:
        type: string
        description: deleted by user id
        example: 588f7ee98f138b19220041a7
      deleteBehalfId:
        type: string
        description: deleted on behalf of user id
        example: 588f7ee98f138b19220041a7
      deleteAttribution:
        $ref: '#/definitions/Attribution'
      deleteAt:
        type: string
        description: deleted timestamp
        example: '2017-01-24T13:57:52Z'
  ShareAccess:
    type: object
    required:
    - access
    properties:
      access:
        type: string
        description: access permission level
        enum:
        - NONE
        - LIMITED_READ
        - LIMITED_WRITE
        - STANDARD_READ
        - STANDARD_WRITE
        - COMPENSATION_READ
        - FULL_READ
        - COMP_PLANNING_PARTICIPANT
        - COMPENSATION_WRITE
        - WRITE
        - COMPENSATION_OWNER
        - OWNER
      userId:
        type: string
        description: user id
        example: 5887a7718f138b6a2a0041a7
      groupId:
        type: string
        description: group id
        example: 5887a7718f138b6a2a0041a7
      fields:
        type: string
        description: fields
        example: name,image,title
  PolicyRule:
    type: object
    properties:
      allow:
        type: array
        description: allow rules
        example: '[''job:read'', ''person.read'']'
        items:
          type: string
      deny:
        type: array
        description: deny rules
        example: '[''job:read'', ''person.read'']'
        items:
          type: string
      categories:
        type: array
        description: categories the rule is limited to
        example: '[''Compensation'', ''Stock Grants'']'
        items:
          type: string
      fields:
        type: array
        description: fields the rule is limited to
        example: '[''base'']'
        items:
          type: string
      departmentIds:
        type: array
        description: departments the rule is limited to
        uniqueItems: true
        items:
          type: string
          example: 588f7ee98f138b19220041a7
      filter:
        type: string
        description: custom filter the rule is limited to
        example: department:engineering and under:me
      directions:
        type: array
        description: directions that the rule applies to -- either self or under
        items:
          type: string
      types:
        type: array
        description: types that the rule applies to
        items:
          type: string
      targets:
        type: array
        description: targets allowed for messaging (email addresses, chat channels, user ids)
        items:
          $ref: '#/definitions/PolicyRuleTarget'
      visibleSensitive:
        type: array
        description: if specified, controls visibility of sensitive entities -- for example, ['Manager Shared', 'Manager Only']
        items:
          type: string
      fieldsSensitive:
        type: array
        description: if specified, controls applicability of fields by sensitivity -- for example, ['Manager Shared', 'Manager Only']
        items:
          type: string
  Name:
    type: object
    required:
    - last
    properties:
      first:
        type: string
        description: first name
        example: Jane
        minItems: 0
        maxItems: 80
      middle:
        type: string
        description: middle name
        example: Quidditch
        minItems: 0
        maxItems: 80
      last:
        type: string
        description: last name
        example: Public
        minItems: 0
        maxItems: 80
      pref:
        type: string
        description: preferred first name
        example: JQ
        minItems: 0
        maxItems: 80
      prefLast:
        type: string
        description: preferred last name
        example: Smith
        minItems: 0
        maxItems: 80
  OrgDomain:
    type: object
    required:
    - domain
    - aliases
    properties:
      domain:
        type: string
      aliases:
        type: array
        uniqueItems: true
        items:
          type: string
  JobRelationship:
    type: object
    required:
    - jobId
    - type
    properties:
      jobId:
        type: string
        description: destination job id
        example: 5887a7718f138b6a2a0041a7
      type:
        type: string
        description: type of relationship
        enum:
        - MANAGER
        - DIRECT
        - INDIRECT_MANAGER
        - INDIRECT
        - NONE
