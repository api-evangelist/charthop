        - FORM_RESPONSE_SUMMARY
        - REPORT_RESULT_SUMMARY
        - SCENARIO_PLANNING
        - CQL
        - CQL_TRANSLATE
        - PROMPT_SUGGEST
        - JOB_CODE_MATCH
      parentAiPromptId:
