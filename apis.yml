aid: charthop
name: Charthop
description: >-
  ChartHop is an AI-powered people-analytics and workforce-planning platform that unifies
  HR, finance, and business data in a single system so HR and finance teams can run
  headcount planning, compensation cycles, performance and goals, engagement, and org
  reporting without spreadsheets. ChartHop exposes an extensible REST API (738 operations,
  Swagger 2.0) that reads and updates the entire org graph — people, jobs, groups,
  compensation, goals, forms, time off, approvals, and more — plus a webhook/event system
  and a first-party MCP server (JSON-RPC 2.0 over Streamable HTTP, OAuth 2.1 + PKCE) for
  AI agents. Added to the API Evangelist network as an a16z / Cowboy Ventures portfolio
  company and enriched from its live developer surface.
